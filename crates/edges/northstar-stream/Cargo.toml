[package]
name = "northstar-stream"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Session core for Northstar XMPP streams: transport-neutral stanza dispatch"
publish = false

[features]
# Test-only queue helpers the root crate's tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dashmap = "6.1"
northstar-auth-application = { path = "../../contexts/auth/northstar-auth-application" }
northstar-delivery-core = { path = "../../contexts/message/northstar-delivery-core" }
northstar-message-core = { path = "../../contexts/message/northstar-message-core" }
northstar-room-application = { path = "../../contexts/room/northstar-room-application" }
northstar-room-core = { path = "../../contexts/room/northstar-room-core" }
northstar-roster-core = { path = "../../contexts/roster/northstar-roster-core" }
northstar-session-application = { path = "../../contexts/session/northstar-session-application" }
northstar-session-core = { path = "../../contexts/session/northstar-session-core" }
northstar-xml-builder = { path = "../../kernel/northstar-xml-builder" }
northstar-xmpp-types = { path = "../../kernel/northstar-xmpp-types" }
rand = "0.8"
roxmltree = "0.20"
tokio = { version = "1.43", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
northstar-session-postgres = { path = "../../contexts/session/northstar-session-postgres", features = ["test-support"] }
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
