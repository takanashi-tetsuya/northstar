[package]
name = "restore-verifier"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Validate Northstar backup, restore ordering, and deletion-propagation policy"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0"
