[package]
name = "northstar-telemetry"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Process telemetry for Northstar: structured logging, the metrics registry and the process-wide counters that contexts update"
publish = false

[dependencies]
anyhow = "1.0"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
