[package]
name = "northstar-auth-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Application services of Northstar authentication and accounts."
publish = false

[features]
# Test-only entry points the root crate's cross-context auth tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = "0.4"
northstar-archive-core = { path = "../../archive/northstar-archive-core" }
northstar-auth-core = { path = "../northstar-auth-core" }
northstar-session-core = { path = "../../session/northstar-session-core" }
uuid = { version = "1.12", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
