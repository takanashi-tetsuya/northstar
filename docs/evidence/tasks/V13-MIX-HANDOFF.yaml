schema_version: "1.0"
acceptance:
  id: "V13-MIX-HANDOFF"
  title: "MIX v13 durable transport hand-off acceptance"
  status: "in-progress"
  acceptance_state: "pending-isolated-runtime-evidence"
  source_commit: "fd5a8af493c989267377be75247a9aabeffce140"
  branch: "dev"
  independent_from: "M00-03"
scope:
  purpose: >-
    Record transport hand-off semantics independently from listener/fixture work.
    A hand-off is not recorded as end-to-end delivery unless its authority,
    transport-write, and peer-confirmation facts are each evidenced.
  non_claims:
    - "A database lease transfer alone is not a socket write."
    - "A socket, Stream Management, or BOSH recoverability boundary is not remote peer confirmation."
    - "A remote acknowledgement alone does not prove an application-level recipient acknowledgement."
  required_scenarios:
    - id: "lease-rotation-ack-loss"
      action: "Rotate the recipient lease, lose the source-side acknowledgement, and retry from the authoritative owner."
    - id: "remote-crash-after-handoff"
      action: "Crash the remote owner after authority transfer and before a final source acknowledgement."
    - id: "late-stale-token-completion"
      action: "Attempt completion with the old token after a newer lease/token is authoritative."
    - id: "sm-bosh-takeover-retry"
      action: "Retry after a Stream Management or BOSH recoverability takeover."
    - id: "expired-lease-old-node-recovery"
      action: "Allow the lease to expire, then verify an old node cannot recover or acknowledge the replacement claim."
    - id: "cancellation-and-shutdown"
      action: "Cancel an in-flight attempt and perform orderly worker shutdown without allowing a stale local transport hand-off."
required_observations:
  - fact: "authority_handoff"
    meaning: "The durable row is owned by exactly one valid lease/token/node fence."
  - fact: "transport_write"
    meaning: "The exact outbound transport crossed its documented socket, SM, or BOSH recoverability boundary."
  - fact: "peer_confirmation"
    meaning: "A remote protocol acknowledgement matched the current request/token; it is not inferred from a local write."
implementation_locations:
  - "migrations/0135_mix_transport_handoffs.sql"
  - "migrations/0136_sm_mix_teardown_release.sql"
  - "migrations/0137_mix_cluster_transport_handoffs.sql"
  - "src/db/mix.rs"
  - "src/cluster.rs"
  - "src/xmpp/protocol/mix.rs"
