[package]
name = "northstar-abuse-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "The Northstar anti-abuse guard, its persistence port, and its login and challenge services."
publish = false

[features]
# Test-only entry points the root crate's cross-context abuse tests use.
test-support = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
hmac = "0.12"
northstar-abuse-policy = { path = "../northstar-abuse-policy" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
rand = "0.8"
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.43", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
northstar-abuse-policy = { path = "../northstar-abuse-policy", features = ["test-support"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
