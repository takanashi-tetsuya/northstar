            bash scripts/xep0487-runtime-wsl.sh

      - name: Upload failed XEP-0487 diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xep0487-command-diagnostics-${{ github.run_id }}
          # The wrapper retains raw logs only on the ephemeral runner. Upload
