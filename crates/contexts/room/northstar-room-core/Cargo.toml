[package]
name = "northstar-room-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
northstar-xep-0045 = { path = "../../../kernel/northstar-xep-0045" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
sha2 = "0.10"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
northstar-federation-core = { path = "../../federation/northstar-federation-core" }
