[package]
name = "northstar-federation-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PostgreSQL persistence of Northstar's durable federation outbox."
publish = false

[features]
# Test-only entry points the root crate's integration tests use.
test-support = []

[dependencies]
anyhow = "1.0"
northstar-federation-application = { path = "../northstar-federation-application" }
northstar-federation-core = { path = "../northstar-federation-core" }
northstar-telemetry = { path = "../../../platform/northstar-telemetry" }
northstar-xep-0359 = { path = "../../../kernel/northstar-xep-0359" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
northstar-postgres = { path = "../../../platform/northstar-postgres" }
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
