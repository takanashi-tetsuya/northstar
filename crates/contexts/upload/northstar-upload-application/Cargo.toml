[package]
name = "northstar-upload-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Typed commands, validation rules, and application boundaries for HTTP file upload"
publish = false

[dependencies]
anyhow = "1.0"
northstar-auth-core = { path = "../../auth/northstar-auth-core" }
northstar-upload-core = { path = "../northstar-upload-core" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "sync"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt", "time"] }
