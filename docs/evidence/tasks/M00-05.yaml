schema_version: "1.0"
task:
  id: "M00-05"
  title: "Validate durable protocol behavior and MIX business correctness"
  status: "in-progress"
  branch: "dev"
  acceptance_state: "pending-isolated-protocol-evidence"
scope:
  owns:
    - "MIX database, wire, federation, Stream Management and BOSH behavior assigned to M00-05 by the Program 6 evidence map."
    - "Message-ordering and durable-claim correctness, including foreground latency boundaries."
    - "Canonical history/admission boundary tests whose input must match the protocol limit."
    - "The parent protocol obligations for MUC, S2S/component delivery, recovery and disaster behavior recorded by the Program 6 evidence map; splitting v13 into its own card does not remove them."
  does_not_own:
    - "Listener/fixture process ownership owned by M00-03."
    - "Database role/migration catalog authority owned by M00-04."
    - "The v13 hand-off card has independent acceptance facts, but remains required sub-evidence for this task rather than a replacement for its parent protocol obligations."
current_work:
  - "The archive maximum-domain fixture uses the real 253-octet DNS boundary rather than a 254-octet input with a 253-octet expectation."
  - "MIX first claims do not await unrelated retention cleanup. A predecessor in the same recipient ordering domain, including an expired unowned row, blocks its successor until a bounded maintenance page records the durable terminal projection."
  - "The isolated MIX delivery, cross-node, SM and BOSH fixture results remain required before acceptance."
candidate_preparation:
  plan: "N00-N07 bounded candidate preparation (2026-09-07); no PostgreSQL concurrency, transport, or federation result is implied."
  source_state: "the a024755 candidate was reviewed but not accepted; the next bounded candidate uses the v2 source-input manifest, which excludes every target/ build-output path."
  source_input_fingerprint: "historical v1 fingerprint superseded for candidate identity because it included tracked target/ build output; no new fingerprint is asserted until C4 records an exact input."
  n03_jid_boundary:
    dns_name: "The 253-octet ASCII DNS presentation boundary is 63.63.63.61 labels; 254 octets and 64-octet labels are rejected after strict IDNA A-label validation."
    jid_scope: "This does not redefine RFC 7622 localpart/resourcepart 1023-octet limits or case-sensitive opaque resourceparts, and does not make a database-index test pass by shrinking its other inputs."
    database_follow_up: "Archive scope/index and collision behavior remain runtime database cases (JD07/JD08), not evidence from the pure canonicalizer tests."
  n04_scheduler_policy:
    foreground: "claim_mix_deliveries performs only the fenced claim; retention is not a foreground prerequisite."
    maintenance: "The worker owns one fixed 60-second deadline. Delivery wakes do not reset it; a completed delayed page schedules one future page rather than catch-up bursts."
    budget: "Each retention helper retains its existing bounded page size and each unclaimed database turn keeps the five-second cancellation/deadline budget."
    ordering: "A predecessor blocks only its own recipient sequence domain until its row is removed by a durable terminal transition. Expiry alone is not terminal; an expired unowned head waits for bounded dead-letter finalization, while an unrelated recipient and a first delivery do not wait for retention."
    pure_mapping:
      MX01: "mix_maintenance_starts_after_the_first_foreground_claim_window"
      MX02: "mix_maintenance_runs_only_at_its_fixed_deadline"
      MX03: "mix_maintenance_deadline_is_not_reset_by_foreground_work"
      MX04: "mix_maintenance_skips_missed_ticks_and_yields_between_pages"
      MX05: "cancellation_preempts_a_pending_mix_outbox_database_turn"
      MX06: "failed_mix_outbox_lane_cancels_and_drains_its_peer"
      MX07: "delivery_order_contract_tests::mx08_expired_unowned_predecessor_blocks_until_terminalization models the terminalization gate before a head may disappear."
      MX08: "delivery_order_contract_tests::mx08_expired_unowned_predecessor_blocks_until_terminalization plus the ignored SQL fixture an_expired_unowned_head_blocks_until_terminalized."
      MX09: "delivery_order_contract_tests::mx09_and_mx11_scope_a_strict_head_to_its_recipient_ordering_domain models independent recipient progress."
      MX10: "claimed_mix_cancellation_drops_a_pending_renewal_and_releases_the_gate plus claimed_mix_final_database_turn_honors_the_shared_deadline"
      MX11: "delivery_order_contract_tests::mx09_and_mx11_scope_a_strict_head_to_its_recipient_ordering_domain models strict less-than predecessor selection."
      MX12: "maintenance_wait_continues_polling_claimed_work_that_releases_it plus mix_maintenance_skips_missed_ticks_and_yields_between_pages."
    database_required:
      - "MX07/MX08: PostgreSQL expired-head ownership, dead-letter transition and exact SQL row progression"
      - "MX09: cross-recipient progress under PostgreSQL row locking"
      - "MX11: PostgreSQL sequence constraints/query plan and strict predecessor behavior"
      - "MX12: multi-page maintenance progress with actual pool/transaction behavior"
  n05_static_guard:
    change: "The outbound XML gate classifies SQL literal contents rather than exempting src/db/mix.rs, a directory, or raw strings. The native SQL strict-predecessor operator is retained."
    positive_and_negative: "The checker self-tests SQL comparison operators, SQL plus a real XML string in one file, real raw XML rejection, structured builder acceptance, cfg(test) masking, and an architecture permit-owner omission."
  runtime_status: "not-run: safety-pause (no isolated PostgreSQL, MIX wire, two-node federation, SM, BOSH, Redis, or recovery execution)"
  n07_receipt_reference:
    source_fingerprint: "historical v1 record superseded for candidate identity; C4 must attach the exact v2 manifest, toolchain, binary hashes, command receipts and changed-path list."
    passed_pure_unit: "two DNS/JID boundary tests and MIX ordering/scheduler/cancellation models; these do not prove SQL concurrency or delivery."
    pending: "JD07/JD08, PostgreSQL portions of MX07-MX12, and all protocol transport evidence remain not-run: safety-pause."
  parent_obligation_register:
    protocol_and_muc: "MUC routing, room ordering, affiliation and history obligations remain pending/bounded under M00-05; no MIX-only card closes them."
    s2s_and_components: "S2S/component claim ordering, fencing, retry and failure recovery remain pending/bounded under M00-05."
    recovery_and_disaster: "Crash, lease expiry, SM/BOSH takeover, restore and disaster recovery obligations remain pending/bounded; V13-MIX-HANDOFF records its required hand-off subset."
evidence:
