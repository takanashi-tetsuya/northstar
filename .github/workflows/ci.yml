        with:
          name: listener-readiness-scheduled-${{ matrix.fixture }}-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/northstar-ci-diagnostics/*.redacted.log
          # Keep the scheduled evidence lane equally strict: an upload action
