[package]
name = "northstar-auth-xmpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "SASL2 and in-band registration parsing and wire forms of client sessions for Northstar"
publish = false

[features]
# Test-only entry points the root crate's cross-context auth tests use.
test-support = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
northstar-auth-application = { path = "../northstar-auth-application" }
northstar-auth-core = { path = "../northstar-auth-core" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
roxmltree = "0.20"
uuid = { version = "1.12", features = ["v4"] }
zeroize = "1.8"
