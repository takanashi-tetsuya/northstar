[package]
name = "northstar-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "The Northstar PostgreSQL schema migrations, embedded at build time"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt"] }
