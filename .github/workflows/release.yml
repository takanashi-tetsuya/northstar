name: Release preparation

on:
  push:
    branches:
      - main
      - 'codex/release-*'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded development previews cannot delay the latest candidate.
  # Tag publication remains serialized; manual runs have independent groups.
  group: release-preparation-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') }}

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      owner: ${{ steps.release.outputs.owner }}
    steps:
      - name: Check out triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and derive release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml package version is missing or is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          publish=false
          tag=""
          version="$package_version"

          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            publish=true
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$package_version" ]]; then
              echo "release tag $tag must exactly match Cargo.toml version v$package_version" >&2
              exit 1
            fi
            git show-ref --verify --quiet "refs/tags/$tag" || {
              echo "triggering ref did not resolve to local tag $tag" >&2
              exit 1
            }
            if [[ "$(git rev-parse "$tag^{commit}")" != "$commit" ]]; then
              echo "checked-out commit does not match $tag" >&2
              exit 1
            fi
            release_series="${package_version%.*}"
            release_series_changelog="changelog/v${release_series}.md"
            for release_doc in CHANGELOG.md "$release_series_changelog" README.md; do
              test -f "$release_doc" || {
                echo "required release document is missing: $release_doc" >&2
                exit 1
              }
              if grep -Fi 'Unreleased' "$release_doc" >/dev/null; then
                echo "$release_doc still marks $package_version as Unreleased" >&2
                exit 1
              fi
            done
            grep -F "## [$package_version] -" CHANGELOG.md >/dev/null || {
              echo "CHANGELOG.md has no finalized $package_version release heading" >&2
              exit 1
            }
            grep -F "**Package version:** \`$package_version\`" "$release_series_changelog" >/dev/null || {
              echo "$release_series_changelog does not identify package $package_version" >&2
              exit 1
            }
            grep -F "current package version is \`$package_version\`" README.md >/dev/null || {
              echo "README.md does not identify package $package_version" >&2
              exit 1
            }
          fi

          for dockerfile in Dockerfile deploy/backup.Dockerfile deploy/database-grants.Dockerfile; do
            if ! grep -Fx "ARG NORTHSTAR_VERSION=$package_version" "$dockerfile" >/dev/null; then
              echo "$dockerfile default image version does not match Cargo.toml" >&2
              exit 1
            fi
          done

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source_date_epoch="$(git show -s --format=%ct "$commit")"
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "short_sha=${commit:0:12}"
            echo "source_date_epoch=$source_date_epoch"
            echo "owner=$owner"
          } >>"$GITHUB_OUTPUT"

          if [[ "$publish" == true ]]; then
            echo "Validated tag $tag at $commit for draft release preparation." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run for $commit; no GHCR package or GitHub Release will be published." >>"$GITHUB_STEP_SUMMARY"
          fi

  release-qualification:
    name: Qualify exact release commit
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Require signed main tag and successful exact-commit CI
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/verify-release-ci.mjs

      - name: Record build-only qualification for non-tag runs
        if: needs.prepare.outputs.publish != 'true'
        run: echo 'Build-only run; release CI qualification is required before publication.' >> "$GITHUB_STEP_SUMMARY"

  build-binaries:
    name: Build ${{ matrix.label }} package
    needs: [prepare, release-qualification]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux AMD64
            id: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows AMD64
            id: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: "0"
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      # Keep the native Windows package independent of the Visual C++ runtime.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - name: Check out immutable source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Python for portable packaging and fixture preflight
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore Windows fixture tools before compilation
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/northstar-release-pg17
          key: release-pg17-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('scripts/ci-postgres17-tools.sh', 'scripts/ci-postgres17-windows.ps1') }}

      - name: Verify restricted Windows PostgreSQL fixture before compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci-postgres17-windows.ps1 -Prefix "$env:RUNNER_TEMP/northstar-release-pg17"
          python scripts/test-release-postgres-windows.py --pg-bin "$env:RUNNER_TEMP/northstar-release-pg17/bin"
          if ($LASTEXITCODE -ne 0) { throw 'Windows PostgreSQL fixture preflight failed' }

      - name: Install pinned Rust 1.97.1 target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Restore native release compiler work
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Explicit --target builds host build scripts and proc macros in target/release.
          # Share compiler work by configuration instead of uploading it for
          # every source commit. The locked Cargo build below always runs.
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/release
            !target/release/incremental
            target/${{ matrix.target }}/release
            !target/${{ matrix.target }}/release/incremental
          key: native-release-v2-${{ runner.os }}-${{ matrix.runner }}-${{ matrix.target }}-1.97.1-crt-static-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config*', 'rust-toolchain*') }}-shared
          restore-keys: |
            native-release-v2-${{ runner.os }}-${{ matrix.runner }}-${{ matrix.target }}-1.97.1-crt-static-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.cargo/config*', 'rust-toolchain*') }}-

      - name: Build locked release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux binary version identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rust-xmpp-server"
          actual="$("$binary" --version)"
          expected="xmpp-server $RELEASE_VERSION"
          if [[ "$actual" != "$expected" ]]; then
            echo "binary version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Verify Windows binary version identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target\${{ matrix.target }}\release\rust-xmpp-server.exe"
          $actual = (& $binary --version).Trim()
          $expected = "xmpp-server $env:RELEASE_VERSION"
          if ($actual -ne $expected) {
            throw "binary version mismatch: expected '$expected', got '$actual'"
          }

      - name: Strip Linux release binary
        if: runner.os == 'Linux'
        run: strip "target/${{ matrix.target }}/release/rust-xmpp-server"

      - name: Package complete native distribution
        run: >-
          python scripts/release-package.py pack
          --binary "target/${{ matrix.target }}/release/rust-xmpp-server${{ runner.os == 'Windows' && '.exe' || '' }}"
          --target "${{ matrix.id }}"
          --version "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --epoch "${{ needs.prepare.outputs.source_date_epoch }}"
          --output dist

      - name: Preserve package for release assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-native-packages:
    name: Verify downloaded ${{ matrix.id }} package
    needs: [prepare, build-binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            runner: ubuntu-22.04
            archive: .tar.gz
            executable: ''
          - id: windows-amd64
            runner: windows-2022
            archive: .zip
            executable: .exe
    steps:
      - name: Check out verification tools at the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Install Python for native package verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download this run's native package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-${{ matrix.id }}
          path: dist
          digest-mismatch: error

      - name: Verify package contents and extracted executable
        run: >-
          python scripts/release-package.py verify
          --archive "dist/northstar-${{ needs.prepare.outputs.version }}-${{ matrix.id }}${{ matrix.archive }}"
          --binary "dist/northstar-${{ needs.prepare.outputs.version }}-${{ matrix.id }}${{ matrix.executable }}"
          --target "${{ matrix.id }}"
          --version "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --output "${{ runner.temp }}/northstar-extracted"

      - name: Restore private PostgreSQL test tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/northstar-release-pg17
          key: release-pg17-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('scripts/ci-postgres17-tools.sh', 'scripts/ci-postgres17-windows.ps1') }}

      - name: Prepare private Linux PostgreSQL tools
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-install-ubuntu-packages.sh bison flex
          bash scripts/ci-postgres17-tools.sh "$RUNNER_TEMP/northstar-release-pg17"

      - name: Prepare private Windows PostgreSQL tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-postgres17-windows.ps1 -Prefix "$env:RUNNER_TEMP/northstar-release-pg17"

      - name: Prove extracted Linux runtime startup and assets
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/northstar-release-pg17/lib"
          python scripts/release-native-smoke.py \
            --package "$RUNNER_TEMP/northstar-extracted" \
            --pg-bin "$RUNNER_TEMP/northstar-release-pg17/bin" \
            --evidence "$RUNNER_TEMP/release-evidence/linux-amd64.json"

      - name: Prove extracted Windows runtime startup and assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python scripts/release-native-smoke.py
          --package "$env:RUNNER_TEMP/northstar-extracted"
          --pg-bin "$env:RUNNER_TEMP/northstar-release-pg17/bin"
          --evidence "$env:RUNNER_TEMP/release-evidence/windows-amd64.json"

      - name: Preserve native runtime verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-evidence-${{ matrix.id }}
          path: ${{ runner.temp }}/release-evidence/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14

  publish-images:
    name: Build and verify ${{ matrix.image }} image
    needs: [prepare, release-qualification, build-binaries, verify-native-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: northstar
            dockerfile: Dockerfile
          - image: northstar-backup
            dockerfile: deploy/backup.Dockerfile
          - image: northstar-database-grants
            dockerfile: deploy/database-grants.Dockerfile
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate current release evidence before publishing images
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/verify-release-ci.mjs

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate exact version and commit tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build linux/amd64 image; publish only for a qualified tag
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          tags: ${{ needs.prepare.outputs.publish == 'true' && steps.metadata.outputs.tags || format('northstar-release-test:{0}', needs.prepare.outputs.commit) }}
          build-args: |
            NORTHSTAR_VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ needs.prepare.outputs.commit }}
          provenance: ${{ needs.prepare.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.prepare.outputs.publish == 'true' }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      - name: Sign and publish image provenance
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Select exact image and verify fresh anonymous pull for publication
        id: checked-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          IMAGE_NAME: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="northstar-release-test:$RELEASE_COMMIT"
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="$IMAGE_NAME@$IMAGE_DIGEST"
            anonymous_config="$(mktemp -d "$RUNNER_TEMP/northstar-anonymous-docker.XXXXXXXX")"
            trap 'rm -rf -- "$anonymous_config"' EXIT
            DOCKER_CONFIG="$anonymous_config" docker pull --platform linux/amd64 "$image"
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Verify platform, labels, default user, entrypoint and required files
        run: >-
          python3 scripts/release-image-check.py
          --image '${{ steps.checked-image.outputs.image }}'
          --name '${{ matrix.image }}'
          --version '${{ needs.prepare.outputs.version }}'
          --commit '${{ needs.prepare.outputs.commit }}'
          --evidence 'image-evidence/${{ matrix.image }}.json'

      - name: Download matching Linux package for container asset comparison
        if: matrix.image == 'northstar'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-linux-amd64
          path: dist
          digest-mismatch: error

      - name: Verify and extract matching Linux package
        if: matrix.image == 'northstar'
        run: >-
          python3 scripts/release-package.py verify
          --archive 'dist/northstar-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz'
          --binary 'dist/northstar-${{ needs.prepare.outputs.version }}-linux-amd64'
          --target linux-amd64 --version '${{ needs.prepare.outputs.version }}'
          --commit '${{ needs.prepare.outputs.commit }}'
          --output '${{ runner.temp }}/northstar-container-assets'

      - name: Restore private PostgreSQL tools for container smoke
        if: matrix.image == 'northstar'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/northstar-release-pg17
          key: release-container-pg17-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-postgres17-tools.sh') }}

      - name: Prove default container migration, startup and served assets
        if: matrix.image == 'northstar'
        run: |
          bash scripts/ci-install-ubuntu-packages.sh bison flex
          bash scripts/ci-postgres17-tools.sh "$RUNNER_TEMP/northstar-release-pg17"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/northstar-release-pg17/lib"
          python3 scripts/release-native-smoke.py \
            --package "$RUNNER_TEMP/northstar-container-assets" \
            --pg-bin "$RUNNER_TEMP/northstar-release-pg17/bin" \
            --image '${{ steps.checked-image.outputs.image }}' \
            --evidence image-evidence/container-runtime.json

      - name: Preserve exact image verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-evidence-${{ matrix.image }}
          path: image-evidence/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Record immutable image digest
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-digest
          printf '%s@%s\n' \
            'ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}' \
            '${{ steps.image.outputs.digest }}' \
            >'image-digest/${{ matrix.image }}.txt'

      - name: Preserve image digest for release assembly
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-digest-${{ matrix.image }}
          path: image-digest/${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 14

  assemble-release-assets:
    name: Checksum and attest packages
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-binaries.result == 'success' &&
      needs.verify-native-packages.result == 'success' &&
      needs.publish-images.result == 'success'
    needs:
      - prepare
      - build-binaries
      - verify-native-packages
      - publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out immutable evidence assembly tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true

      - name: Download successful native verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-native-evidence-*
          path: native-evidence
          merge-multiple: true
          digest-mismatch: error

      - name: Download published image digests
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Download successful image verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-evidence-*
          path: image-evidence
          merge-multiple: true
          digest-mismatch: error

      - name: Generate and verify SHA-256 checksums
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          linux_asset="northstar-${RELEASE_VERSION}-linux-amd64.tar.gz"
          linux_binary="northstar-${RELEASE_VERSION}-linux-amd64"
          windows_asset="northstar-${RELEASE_VERSION}-windows-amd64.zip"
          windows_binary="northstar-${RELEASE_VERSION}-windows-amd64.exe"
          test -f "dist/$linux_asset"
          test -f "dist/$linux_binary"
          test -f "dist/$windows_asset"
          test -f "dist/$windows_binary"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4

          python3 scripts/release-evidence.py \
            --directory native-evidence --output dist/RELEASE-EVIDENCE.json \
            --image-directory image-evidence --published "$PUBLISH_RELEASE" \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          assets=("$linux_asset" "$linux_binary" "$windows_asset" "$windows_binary" RELEASE-EVIDENCE.json)
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            mapfile -t digest_files < <(find image-digests -maxdepth 1 -type f -name '*.txt' | sort)
            test "${#digest_files[@]}" -eq 3
            cat "${digest_files[@]}" | sort >dist/IMAGE_DIGESTS
            test "$(wc -l <dist/IMAGE_DIGESTS)" -eq 3
            test "$(grep -Ec '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$' dist/IMAGE_DIGESTS)" -eq 3
            assets+=(IMAGE_DIGESTS)
          fi

          (
            cd dist
            sha256sum "${assets[@]}" >SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Sign package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload verified dry-run or release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  prepare-draft-release:
    name: Create or update draft GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - assemble-release-assets
      - publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Re-check immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Revalidate release evidence before preparing the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_QUALIFICATION_FILE: release-qualification.json
        run: node scripts/verify-release-ci.mjs

      - name: Render reviewable draft notes from exact release evidence
        run: >-
          python3 scripts/release-notes.py --qualification release-qualification.json
          --evidence dist/RELEASE-EVIDENCE.json --output release-notes.md

      - name: Create or update draft and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" \
             || "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
            echo "$RELEASE_TAG moved after release validation" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

          release_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            create_options=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --draft
              --title "Northstar $RELEASE_VERSION"
              --notes-file release-notes.md
            )
            gh "${create_options[@]}"
          else
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "refusing to overwrite already-published release $RELEASE_TAG" >&2
              exit 1
            fi
            release_id="$(jq -r '.id' <<<"$release_json")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name="Northstar $RELEASE_VERSION" \
              -F body=@release-notes.md \
              -F draft=true \
              -F prerelease=false >/dev/null
          fi

          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Draft release $RELEASE_TAG uploaded; independent fresh-download verification follows." \
            >>"$GITHUB_STEP_SUMMARY"

  verify-draft-downloads:
    name: Verify fresh ${{ matrix.id }} draft download
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, prepare-draft-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            runner: ubuntu-22.04
            archive: .tar.gz
            executable: ''
          - id: windows-amd64
            runner: windows-2022
            archive: .zip
            executable: .exe
    steps:
      - name: Check out immutable verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Install Python for download verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download from the draft Release and verify every asset's provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          for asset in downloaded/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify complete downloaded set and exact release identity
        run: >-
          python scripts/release-download.py --directory downloaded
          --version '${{ needs.prepare.outputs.version }}'
          --commit '${{ needs.prepare.outputs.commit }}'

      - name: Extract downloaded native archive and execute its version check
        run: >-
          python scripts/release-package.py verify
          --archive 'downloaded/northstar-${{ needs.prepare.outputs.version }}-${{ matrix.id }}${{ matrix.archive }}'
          --binary 'downloaded/northstar-${{ needs.prepare.outputs.version }}-${{ matrix.id }}${{ matrix.executable }}'
          --target '${{ matrix.id }}' --version '${{ needs.prepare.outputs.version }}'
          --commit '${{ needs.prepare.outputs.commit }}'
          --output '${{ runner.temp }}/northstar-fresh-release'

  finalize-draft:
    name: Mark verified draft ready for manual publication
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, verify-draft-downloads]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out immutable release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download this run's verified release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets-${{ needs.prepare.outputs.version }}
          path: dist
          digest-mismatch: error

      - name: Revalidate CI and finalize the unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_QUALIFICATION_FILE: release-qualification.json
        run: |
          set -euo pipefail
          node scripts/verify-release-ci.mjs
          python3 scripts/release-notes.py --qualification release-qualification.json \
            --evidence dist/RELEASE-EVIDENCE.json --output release-notes.md --verified
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --notes-file release-notes.md
          echo "All release preparation checks passed. Draft $RELEASE_TAG is ready for the maintainer to publish." >> "$GITHUB_STEP_SUMMARY"
