[package]
name = "northstar-xep-0045"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free XEP-0045 Multi-User Chat protocol types, permission evaluation, validation, and XML builders"
publish = false

[package.metadata.northstar-xep]
id = 45
route-ids = [
    "presence|http://jabber.org/protocol/muc|x",
    "presence|http://jabber.org/protocol/muc#user|x",
    "message|http://jabber.org/protocol/muc#user|x",
    "iq-get|http://jabber.org/protocol/muc#admin|query",
    "iq-set|http://jabber.org/protocol/muc#admin|query",
    "iq-get|http://jabber.org/protocol/muc#owner|query",
    "iq-set|http://jabber.org/protocol/muc#owner|query",
]
worker-ids = []

[dependencies]
northstar-xep-core = { path = "../northstar-xep-core" }
northstar-xmpp-types = { path = "../northstar-xmpp-types" }
roxmltree = "0.20"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
