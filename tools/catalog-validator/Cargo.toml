[package]
name = "catalog-validator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Structured validation for the Northstar service, route, and data ownership catalogs"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0"

