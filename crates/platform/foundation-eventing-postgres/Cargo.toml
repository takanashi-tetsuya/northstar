[package]
name = "foundation-eventing-postgres"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "PostgreSQL Outbox/Inbox transaction adapter for Northstar eventing"
publish = false

[dependencies]
northstar-time = { path = "../../kernel/northstar-time", features = ["serde", "postgres"] }
foundation-eventing = { path = "../foundation-eventing" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid"] }
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
