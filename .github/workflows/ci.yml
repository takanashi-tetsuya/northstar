  # A small, real two-node path is a gate, not evidence for the full stress
  # envelope.  It catches setup, template, listener, and cleanup regressions
  # before either regular 20x50 or scheduled 100x50 capacity work begins.
  listener-readiness-stress-smoke:
    name: Listener/readiness smoke (1x1 then 1x2 · ${{ matrix.fixture }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fixture:
          - federation
          - mix-federation
    env:
      # This remains an isolated loopback fixture.  It is intentionally sized
      # only for the 1x1 and 1x2 proofs below, not the pressure matrix.
      NORTHSTAR_LOOPBACK_POSTGRES_MAX_CONNECTIONS: "32"
      NORTHSTAR_LISTENER_STRESS_WORKER_TIMEOUT_SECONDS: "900"
      NORTHSTAR_LISTENER_STRESS_DATABASE_MAX_CONNECTIONS: "2"
      NORTHSTAR_LISTENER_STRESS_DATABASE_MIN_CONNECTIONS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start isolated loopback PostgreSQL fixture
        run: bash scripts/loopback-postgres-ci.sh start

      - name: Install pinned Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.97.1

      - name: Install PostgreSQL client and listener diagnostic tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 postgresql-client

      - name: Populate the locked dependency cache
        run: cargo fetch --locked

      - name: Prove one round with one pair
        env:
          XMPP_TEST_SYSTEM_TOOLCHAIN: "true"
          XMPP_TEST_OFFLINE: "false"
        run: >-
          bash scripts/listener-readiness-stress-wsl.sh
          --mode regular --fixture "${{ matrix.fixture }}" --rounds 1 --pairs 1

      - name: Prove one round with two pairs
        env:
          XMPP_TEST_SYSTEM_TOOLCHAIN: "true"
          XMPP_TEST_OFFLINE: "false"
        run: >-
          bash scripts/listener-readiness-stress-wsl.sh
          --mode regular --fixture "${{ matrix.fixture }}" --rounds 1 --pairs 2

      - name: Upload failed listener/readiness smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listener-readiness-smoke-${{ matrix.fixture }}-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/northstar-ci-diagnostics/*.redacted.log
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated loopback PostgreSQL fixture
        if: always()
        run: bash scripts/loopback-postgres-ci.sh stop

  listener-readiness-stress-regular:
    name: Listener/readiness stress (regular 20x50 · ${{ matrix.fixture }})
    needs: listener-readiness-stress-smoke
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'pull_request') &&
          needs.listener-readiness-stress-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    # This is a capacity ceiling only. Every fixture worker has its own
    # process-group deadline inside the stress driver, so a hung child cannot
    # consume a round until GitHub's job-level timeout.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fixture:
          - federation
          - mix-federation
    env:
      # 50 two-node workers require 100 initial application connections. The
      # driver makes its per-process pool profile explicit; this isolated CI
      # PostgreSQL ceiling covers the 200-connection maximum plus migrator
      # headroom without changing production defaults.
      NORTHSTAR_LOOPBACK_POSTGRES_MAX_CONNECTIONS: "256"
      NORTHSTAR_LISTENER_STRESS_WORKER_TIMEOUT_SECONDS: "900"
      NORTHSTAR_LISTENER_STRESS_DATABASE_MAX_CONNECTIONS: "2"
      NORTHSTAR_LISTENER_STRESS_DATABASE_MIN_CONNECTIONS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start isolated loopback PostgreSQL fixture
        run: bash scripts/loopback-postgres-ci.sh start

      - name: Install pinned Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.97.1

      # These S2S/MIX fixtures have no Redis configuration.  Do not start an
      # unused cache and mistake that for cluster-runtime coverage; Redis
      # pressure remains owned by the cluster/MUC fixture work.
      - name: Install PostgreSQL client and listener diagnostic tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 postgresql-client

      - name: Populate the locked dependency cache
        run: cargo fetch --locked

      - name: Run required regular listener/readiness matrix
        env:
          XMPP_TEST_SYSTEM_TOOLCHAIN: "true"
          XMPP_TEST_OFFLINE: "false"
        run: >-
          bash scripts/listener-readiness-stress-wsl.sh
          --mode regular --fixture "${{ matrix.fixture }}" --rounds 20 --pairs 50

      - name: Upload failed listener/readiness diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: listener-readiness-regular-${{ matrix.fixture }}-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/northstar-ci-diagnostics/*.redacted.log
          # The stress parent and every supervised worker must retain a
          # redacted artifact on failure.  Do not report a green upload step
          # when a preflight/template failure produced no usable evidence.
          if-no-files-found: error
          retention-days: 14

      - name: Stop isolated loopback PostgreSQL fixture
        if: always()
        run: bash scripts/loopback-postgres-ci.sh stop

  listener-readiness-stress-scheduled:
    name: Scheduled listener/readiness stress (100x50 · ${{ matrix.fixture }})
    needs: listener-readiness-stress-smoke
    if: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
