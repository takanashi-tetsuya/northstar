            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            NORTHSTAR_XEP0487_SKIP_BUILD=true \
            XMPP_TEST_SYSTEM_TOOLCHAIN=true \
            XMPP_TEST_OFFLINE=false \
            bash scripts/xep0487-runtime-wsl.sh

      - name: Stop loopback-only PostgreSQL fixture
        if: always()
        run: bash scripts/loopback-postgres-ci.sh stop

