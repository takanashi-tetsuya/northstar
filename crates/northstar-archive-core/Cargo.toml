[package]
name = "northstar-archive-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free XEP-0313 MAM archive domain models, visibility projections, and RSM paging"
publish = false

[dependencies]
northstar-xmpp-types = { path = "../northstar-xmpp-types" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
