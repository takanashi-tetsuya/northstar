[package]
name = "northstar-auth-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Application services of Northstar authentication and accounts."
publish = false

[features]
# Test-only entry points the root crate's cross-context auth tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
northstar-abuse-policy = { path = "../../abuse/northstar-abuse-policy" }
northstar-archive-core = { path = "../../archive/northstar-archive-core" }
northstar-auth-core = { path = "../northstar-auth-core" }
northstar-operations-core = { path = "../../operations/northstar-operations-core" }
northstar-roster-core = { path = "../../roster/northstar-roster-core" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-session-core = { path = "../../session/northstar-session-core" }
northstar-telemetry = { path = "../../../platform/northstar-telemetry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
zeroize = "1.8"

[dev-dependencies]
base64 = "0.22"
ring = "0.17.14"
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
