[package]
name = "northstar-xep-0215"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free XEP-0215 external service discovery wire and policy"
publish = false

[package.metadata.northstar-xep]
id = 215
route-ids = [
    "iq-get|urn:xmpp:extdisco:2|services",
    "iq-get|urn:xmpp:extdisco:2|credentials",
]
worker-ids = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
northstar-xep-core = { path = "../northstar-xep-core" }
northstar-xmpp-types = { path = "../northstar-xmpp-types" }
roxmltree = "0.20"
thiserror = "2.0"
zeroize = "1.8"
