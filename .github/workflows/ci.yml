        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.97.1

      - name: Install isolated fixture tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 postgresql-client util-linux

      - name: Build Northstar without privileges
        run: cargo build --locked

      - name: Bind only the isolated HTTPS fixture as root
        run: |
          bash scripts/github-ci-run.sh "XEP-0487 privileged HTTPS runtime" sudo env \
