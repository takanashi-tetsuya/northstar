[package]
name = "northstar-data-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Offline operator data tools of Northstar: XEP-0227 PIE import and export"
publish = false

[features]
# Test-only entry points the root crate's source-contract tests use.
test-support = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
northstar-auth-core = { path = "../../auth/northstar-auth-core" }
northstar-auth-postgres = { path = "../../auth/northstar-auth-postgres" }
northstar-config = { path = "../../../platform/northstar-config" }
northstar-postgres = { path = "../../../platform/northstar-postgres" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
northstar-auth-postgres = { path = "../../auth/northstar-auth-postgres", features = ["test-support"] }
northstar-workflows = { path = "../northstar-workflows", features = ["test-support"] }
tokio = { version = "1.43", features = ["macros", "rt"] }
