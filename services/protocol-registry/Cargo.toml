[package]
name = "service-protocol-registry"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Northstar Protocol Registry Microservice"
publish = false

[dependencies]
foundation-contracts = { path = "../../crates/foundation-contracts" }
foundation-security = { path = "../../crates/foundation-security" }
foundation-telemetry = { path = "../../crates/foundation-telemetry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
thiserror = "2.0"
tracing = "0.1"
sha2 = "0.10"
