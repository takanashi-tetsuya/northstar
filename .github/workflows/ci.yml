  stateful-database-integration:
    name: Isolated PostgreSQL and Redis invariants (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each shard receives its own runner and loopback-only PostgreSQL
    # fixture.  Isolation is what makes this parallelism safe; no shard is
    # given a shared schema, listener, or Redis namespace.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - auth-identity
          - abuse-delivery
          - collaboration-storage
          - pubsub-federation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start loopback-only PostgreSQL fixture
        run: bash scripts/loopback-postgres-ci.sh start

      - name: Install pinned Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.97.1

      - name: Install PostgreSQL and Redis clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-server redis-tools

      - name: Populate the locked offline dependency cache
        run: cargo fetch --locked

      - name: Run isolated database and conflict suite shard
        env:
          XMPP_TEST_SYSTEM_TOOLCHAIN: "true"
          # This is a shard-level safety net.  The runner below places a
          # shorter, explicit deadline around every suite and retains a
          # redacted transcript when it expires.
          NORTHSTAR_CI_COMMAND_TIMEOUT_SECONDS: "1800"
        run: |
          bash scripts/github-ci-run.sh "Stateful database ${{ matrix.shard }}" \
            bash scripts/stateful-database-ci.sh "${{ matrix.shard }}"

      - name: Upload failed database shard diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stateful-database-${{ matrix.shard }}-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/northstar-ci-diagnostics/*.redacted.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop loopback-only PostgreSQL fixture
        if: always()
        run: bash scripts/loopback-postgres-ci.sh stop

  mix-integration:
