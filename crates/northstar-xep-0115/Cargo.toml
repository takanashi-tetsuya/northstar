[package]
name = "northstar-xep-0115"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free XEP-0115 Entity Capabilities verification, canonicalization, wire parsing, and builders"
publish = false

[package.metadata.northstar-xep]
id = 115
route-ids = [
    "presence|http://jabber.org/protocol/caps|c",
]
worker-ids = []

[dependencies]
northstar-xep-core = { path = "../northstar-xep-core" }
roxmltree = "0.20"
thiserror = "2.0"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
