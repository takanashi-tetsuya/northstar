[package]
name = "northstar-xep-0280"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free XEP-0280 Message Carbons policy for Northstar"
publish = false

[package.metadata.northstar-xep]
id = 280
route-ids = [
    "iq-set|urn:xmpp:carbons:2|enable",
    "iq-set|urn:xmpp:carbons:2|disable",
]
worker-ids = []

[dependencies]
northstar-xep-core = { path = "../northstar-xep-core" }
northstar-xmpp-types = { path = "../northstar-xmpp-types" }
northstar-xml-builder = { path = "../northstar-xml-builder" }
roxmltree = "0.20"
thiserror = "2.0"
