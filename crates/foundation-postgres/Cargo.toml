[package]
name = "foundation-postgres"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Northstar PostgreSQL connection, transaction, attestation, and migration verification primitives"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time"] }
