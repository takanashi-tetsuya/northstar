[package]
name = "northstar-xmpp-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free RFC 7622 JID types, PRECIS profiles, and IDNA canonicalization for Northstar"
publish = false

[dependencies]
anyhow = "1.0"
idna = "1.1"
precis-profiles = "0.1.13"
serde = { version = "1.0", optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1.0"
