# Northstar Microservices Catalog
# Source of truth for service identities, ownership, databases, RPC, and events.
# Defined per northstar_microservices_deep_audit_2026-09-03.md (Sections 5, 6, 7).

version: "2.0.0"

services:
  # ==========================================
  # Platform Core Services (平台核心服务)
  # ==========================================
  - service_id: xmpp-edge
    implementation_status: prototype
    code_path: "services/xmpp-edge"
    cargo_package: "service-xmpp-edge"
    name: "XMPP C2S Edge Connection Gateway"
    execution_class: transport
    home_key: connection_id
    database: none
    rpc:
      consumes:
        - northstar.identity.v1.IdentityService
        - northstar.session.v1.SessionDirectoryService
        - northstar.registry.v1.ProtocolRegistryService
        - northstar.ingress.v1.MessageIngressService
      provides:
        - northstar.edge.v1.EdgeDeliveryService
    events:
      produces:
        - edge.connection.v1
    slo:
      command_p99_ms: 20
      availability: 99.99

  - service_id: identity
    implementation_status: prototype
    code_path: "services/identity"
    cargo_package: "service-identity"
    name: "User Identity and Credential Authority"
    execution_class: stateful-hot
    home_key: account_id
    database: northstar_identity
    rpc:
      provides:
        - northstar.identity.v1.IdentityService
      consumes:
        - northstar.abuserisk.v1.AbuseRiskService
    events:
      produces:
        - identity.account.v1
        - identity.credential.v1
    slo:
      command_p99_ms: 50
      availability: 99.99

  - service_id: session-directory
    implementation_status: prototype
    code_path: "services/session-directory"
    cargo_package: "service-session-directory"
    name: "Session and Resource Binding Authority"
    execution_class: stateful-hot
    home_key: bare_jid
    database: northstar_session
    rpc:
      provides:
        - northstar.session.v1.SessionDirectoryService
    events:
      produces:
        - session.lifecycle.v1
    slo:
      command_p99_ms: 30
      availability: 99.99

  - service_id: message-ingress
    implementation_status: prototype
    code_path: "services/message-ingress"
    cargo_package: "service-message-ingress"
    name: "Message Admission and Authority Ingress"
    execution_class: stateful-hot
    home_key: sender_account_id
    database: northstar_message_ingress
    rpc:
      provides:
        - northstar.ingress.v1.MessageIngressService
      consumes:
        - northstar.policy.v1.PolicyProjectionService
    events:
      produces:
        - message.accepted.v1
        - message.rejected.v1
    slo:
      command_p99_ms: 40
      availability: 99.99

  - service_id: delivery-router
