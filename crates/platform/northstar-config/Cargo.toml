[package]
name = "northstar-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Validated process configuration for the Northstar XMPP server"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
envy = "0.4.2"
northstar-security = { path = "../northstar-security" }
northstar-web-surface = { path = "../northstar-web-surface" }
northstar-xep-catalog = { path = "../../kernel/northstar-xep-catalog" }
northstar-xmpp-types = { path = "../../kernel/northstar-xmpp-types" }
redis = { version = "1.6.0", features = ["tokio-rustls-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
uuid = { version = "1.12", features = ["v4", "serde"] }
