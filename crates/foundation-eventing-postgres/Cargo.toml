[package]
name = "foundation-eventing-postgres"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "PostgreSQL Outbox/Inbox transaction adapter for Northstar eventing"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
foundation-eventing = { path = "../foundation-eventing" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
