[package]
name = "northstar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# The fuzz harness has its own lockfile and libFuzzer build configuration.
# Production parser crates remain ordinary path dependencies of this workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
libfuzzer-sys = "0.4.13"
northstar-auth-core = { path = "../crates/northstar-auth-core" }
northstar-xep-0060 = { path = "../crates/northstar-xep-0060" }
northstar-xep-0198 = { path = "../crates/northstar-xep-0198" }
northstar-xep-0313 = { path = "../crates/northstar-xep-0313" }
northstar-xml-framing = { path = "../crates/northstar-xml-framing" }
northstar-xmpp-types = { path = "../crates/northstar-xmpp-types" }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

[[bin]]
name = "xml_framing"
path = "fuzz_targets/xml_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_stanza"
path = "fuzz_targets/semantic_stanza.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bosh_ws_framing"
path = "fuzz_targets/bosh_ws_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rest_extractors"
path = "fuzz_targets/rest_extractors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sasl_sm_state"
path = "fuzz_targets/sasl_sm_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mam_pubsub_parsing"
path = "fuzz_targets/mam_pubsub_parsing.rs"
test = false
doc = false
bench = false
