[package]
name = "service-message-ingress"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Northstar Message Admission and Ingress Authority Microservice"
publish = false

[dependencies]
foundation-contracts = { path = "../../crates/foundation-contracts" }
foundation-security = { path = "../../crates/foundation-security" }
foundation-eventing = { path = "../../crates/foundation-eventing" }
foundation-telemetry = { path = "../../crates/foundation-telemetry" }
foundation-service-runtime = { path = "../../crates/foundation-service-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
thiserror = "2.0"
tracing = "0.1"
northstar-xmpp-types = { path = "../../crates/northstar-xmpp-types" }
uuid = { version = "1.12", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "message-ingress"
path = "src/main.rs"
