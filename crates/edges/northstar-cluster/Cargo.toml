[package]
name = "northstar-cluster"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Cross-node edge of Northstar: Redis cluster bus, listener, maintenance and recovery replay"
publish = false

[dependencies]
anyhow = "1.0"
bb8 = "0.9.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
futures = "0.3"
northstar-auth-application = { path = "../../contexts/auth/northstar-auth-application" }
northstar-config = { path = "../../platform/northstar-config" }
northstar-delivery-core = { path = "../../contexts/message/northstar-delivery-core" }
northstar-federation-core = { path = "../../contexts/federation/northstar-federation-core" }
northstar-message-application = { path = "../../contexts/message/northstar-message-application" }
northstar-message-core = { path = "../../contexts/message/northstar-message-core" }
northstar-operations-application = { path = "../../contexts/operations/northstar-operations-application" }
northstar-protocol-runtime = { path = "../../contexts/session/northstar-protocol-runtime" }
northstar-room-application = { path = "../../contexts/room/northstar-room-application" }
northstar-room-core = { path = "../../contexts/room/northstar-room-core" }
northstar-roster-application = { path = "../../contexts/roster/northstar-roster-application" }
northstar-roster-core = { path = "../../contexts/roster/northstar-roster-core" }
northstar-runtime = { path = "../../platform/northstar-runtime" }
northstar-security = { path = "../../platform/northstar-security" }
northstar-session-application = { path = "../../contexts/session/northstar-session-application" }
northstar-session-core = { path = "../../contexts/session/northstar-session-core" }
northstar-stream = { path = "../../edges/northstar-stream" }
northstar-telemetry = { path = "../../platform/northstar-telemetry" }
northstar-xep-0016 = { path = "../../kernel/northstar-xep-0016" }
northstar-xep-0045 = { path = "../../kernel/northstar-xep-0045" }
northstar-xep-0191 = { path = "../../kernel/northstar-xep-0191" }
northstar-xep-0359 = { path = "../../kernel/northstar-xep-0359" }
northstar-xml-builder = { path = "../../kernel/northstar-xml-builder" }
northstar-xmpp-avatar = { path = "../../kernel/northstar-xmpp-avatar" }
northstar-xmpp-types = { path = "../../kernel/northstar-xmpp-types" }
redis = { version = "1.6.0", features = ["tokio-rustls-comp"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
northstar-session-postgres = { path = "../../contexts/session/northstar-session-postgres" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
northstar-auth-application = { path = "../../contexts/auth/northstar-auth-application", features = ["test-support"] }
northstar-message-application = { path = "../../contexts/message/northstar-message-application", features = ["test-support"] }
northstar-operations-application = { path = "../../contexts/operations/northstar-operations-application", features = ["test-support"] }
northstar-room-application = { path = "../../contexts/room/northstar-room-application", features = ["test-support"] }
northstar-runtime = { path = "../../platform/northstar-runtime", features = ["test-support"] }
northstar-security = { path = "../../platform/northstar-security", features = ["test-support"] }
northstar-session-application = { path = "../../contexts/session/northstar-session-application", features = ["test-support"] }
northstar-stream = { path = "../../edges/northstar-stream", features = ["test-support"] }
tokio = { version = "1.43", features = ["test-util"] }
