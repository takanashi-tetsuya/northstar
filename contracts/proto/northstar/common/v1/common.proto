syntax = "proto3";

package northstar.common.v1;

import "google/protobuf/duration.proto";

// Unified, safe error response detail.
//
// Fields 1-6 are retained as deprecated compatibility aliases for the
// pre-M02 contract. New producers must populate reason/domain/correlation_id
// and must not put infrastructure details, credentials, or raw JIDs in
// safe_message.
message ErrorDetail {
  // Deprecated alias for reason. Do not add new producers using this field.
  string code = 1;
  // Whether the client/caller is permitted to retry the command.
  bool retryable = 2;
  // User-facing safe error message with zero internal infrastructure leakage.
  string safe_message = 3;
  // Authoritative state version at the time of rejection (for version barrier check).
  optional uint64 current_version = 4;
  // Detailed field violation list if validation failed.
  repeated FieldViolation violations = 5;
  // Recommended retry backoff duration.
  optional google.protobuf.Duration retry_after = 6;
  // Stable machine reason (e.g. "AUTH_FAILED", "VERSION_CONFLICT").
  string reason = 7;
  // Owning bounded context (e.g. "identity", "delivery", "registry").
  string domain = 8;
  // Safe correlation identifier for support and tracing; never a secret.
  string correlation_id = 9;
}

message FieldViolation {
  string field = 1;
  string description = 2;
}

// Legacy principal context retained only for the migration window.
message AuthContext {
  // Deprecated compatibility envelope. New RPCs must use a verified signed
  // assertion carried in authenticated metadata instead.
  string account_id = 1;
  string canonical_jid = 2;
  uint64 credential_generation = 3;
  repeated string roles = 4;
  string home_region = 5;
}

// Non-authoritative request metadata. Authentication and authorization are
// established by workload mTLS and a verified SignedAssertion, not by fields
// in this message.
message RequestMetadata {
  TraceContext trace = 1;
  optional IdempotencyKey idempotency_key = 2;
  optional PageToken page_token = 3;
  // Caller-generated request identifier used only for tracing and diagnostics.
  string request_id = 4;
}

// Opaque idempotency key. The owning service validates scope and lifetime.
message IdempotencyKey {
  string value = 1;
}

// Opaque pagination cursor. It is not a database offset and must be treated
// as untrusted input by every consumer.
message PageToken {
  bytes value = 1;
}

// Distributed tracing context propagating causal relationships across asynchronous boundaries.
message TraceContext {
  string traceparent = 1;
  string tracestate = 2;
  string correlation_id = 3;
  string causation_id = 4;
}

// Cryptographically verified session assertion issued by Session Directory / Identity.
message SessionAssertion {
  string account_id = 1;
  string canonical_bare_jid = 2;
  string full_jid = 3;
  string connection_id = 4;
  string edge_instance_id = 5;
  uint64 session_epoch = 6;
  uint64 credential_generation = 7;
  string home_region = 8;
  uint64 region_epoch = 9;
  uint64 issued_at_ms = 10;
  uint64 expires_at_ms = 11;
  string audience = 12;
  string nonce = 13;
  string key_id = 14;
  bytes signature = 15;
}
