[package]
name = "northstar-message-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-injected personal-message application service for Northstar"
publish = false

[features]
# Test-only entry points the root crate's saved cases and continuation tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
northstar-abuse-policy = { path = "../../abuse/northstar-abuse-policy" }
northstar-delivery-core = { path = "../northstar-delivery-core" }
northstar-federation-core = { path = "../../federation/northstar-federation-core" }
northstar-message-core = { path = "../northstar-message-core" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-xep-0016 = { path = "../../../kernel/northstar-xep-0016" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
thiserror = "2.0"
northstar-xep-0280 = { path = "../../../kernel/northstar-xep-0280" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
sha2 = "0.10"
tokio = { version = "1.43", features = ["time"] }
tracing = "0.1"
uuid = "1.12"

[dev-dependencies]
northstar-abuse-application = { path = "../../abuse/northstar-abuse-application", features = ["test-support"] }
tokio = { version = "1.43", features = ["macros", "rt", "sync", "test-util", "time"] }
