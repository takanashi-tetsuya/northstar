    "tools/restore-verifier",
    "tools/kafka-policy-generator",
    "tools/architecture-validator",
]
default-members = ["."]
resolver = "2"

[package]
name = "rust-xmpp-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "A single-node, standards-oriented XMPP server written in Rust"
repository = "https://github.com/takanashi-tetsuya/northstar"
homepage = "https://github.com/takanashi-tetsuya/northstar"
readme = "README.md"
publish = false

[dependencies]
northstar-abuse-policy = { path = "crates/contexts/abuse/northstar-abuse-policy" }
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "multipart"] }
arc-swap = "1"
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
dotenvy = "0.15"
futures = "0.3"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["dnssec-aws-lc-rs", "system-config", "tokio"] }
rand = "0.8"
ring = "0.17.14"
roxmltree = "0.20"
rustls-webpki = "0.103"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0"
subtle = "2.6"
hmac = "0.12"
idna = "1.1"
libc = "0.2"
pbkdf2 = { version = "0.12", features = ["hmac"] }
precis-profiles = "0.1.13"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
webpki-roots = "1"
zeroize = "1.8"
x509-parser = { version = "0.18.1", default-features = false }
tracing-appender = "0.2.5"
envy = "0.4.2"
redis = { version = "1.6.0", features = ["tokio-rustls-comp"] }
bb8 = "0.9.1"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
northstar-xep-0184 = { path = "crates/kernel/northstar-xep-0184" }
northstar-xep-0085 = { path = "crates/kernel/northstar-xep-0085" }
northstar-xep-0092 = { path = "crates/kernel/northstar-xep-0092" }
northstar-xep-0199 = { path = "crates/kernel/northstar-xep-0199" }
northstar-xep-0202 = { path = "crates/kernel/northstar-xep-0202" }
northstar-xep-0308 = { path = "crates/kernel/northstar-xep-0308" }
northstar-xep-0333 = { path = "crates/kernel/northstar-xep-0333" }
northstar-xep-0380 = { path = "crates/kernel/northstar-xep-0380" }
northstar-xep-0444 = { path = "crates/kernel/northstar-xep-0444" }
northstar-xep-0461 = { path = "crates/kernel/northstar-xep-0461" }
northstar-xep-core = { path = "crates/kernel/northstar-xep-core" }
northstar-xep-catalog = { path = "crates/kernel/northstar-xep-catalog" }
northstar-xep-0045 = { path = "crates/kernel/northstar-xep-0045" }
northstar-xep-0016 = { path = "crates/kernel/northstar-xep-0016" }
northstar-auth-core = { path = "crates/contexts/auth/northstar-auth-core" }
northstar-xmpp-types = { path = "crates/kernel/northstar-xmpp-types" }
northstar-xml-framing = { path = "crates/kernel/northstar-xml-framing" }
northstar-xml-builder = { path = "crates/kernel/northstar-xml-builder" }
northstar-xep-0059 = { path = "crates/kernel/northstar-xep-0059" }
northstar-xep-0060 = { path = "crates/kernel/northstar-xep-0060" }
northstar-xep-0115 = { path = "crates/kernel/northstar-xep-0115" }
northstar-xep-0191 = { path = "crates/kernel/northstar-xep-0191" }
northstar-xep-0198 = { path = "crates/kernel/northstar-xep-0198" }
northstar-xep-0215 = { path = "crates/kernel/northstar-xep-0215" }
northstar-xep-0280 = { path = "crates/kernel/northstar-xep-0280" }
northstar-xep-0313 = { path = "crates/kernel/northstar-xep-0313" }
northstar-xep-0352 = { path = "crates/kernel/northstar-xep-0352" }
northstar-xep-0357 = { path = "crates/kernel/northstar-xep-0357" }
