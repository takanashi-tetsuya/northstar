          retention-days: 14

      - name: Stop isolated loopback PostgreSQL fixture
        if: always()
        run: bash scripts/loopback-postgres-ci.sh stop

  xep0487-integration:
    name: Privilege-separated XEP-0487 HTTPS discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
