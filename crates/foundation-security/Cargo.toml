[package]
name = "foundation-security"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Security tokens, redacted secrets, and authentication context for Northstar microservices"
publish = false

[dependencies]
zeroize = "1.8"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ring = "0.17.14"
sha2 = "0.10"
