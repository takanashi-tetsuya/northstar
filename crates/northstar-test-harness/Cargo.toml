[package]
name = "northstar-test-harness"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
libc = "0.2"
socket2 = "0.5"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

northstar-abuse-policy = { path = "../northstar-abuse-policy" }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
uuid = { version = "1.12", default-features = false, features = ["serde"] }
sha2 = "0.10"
