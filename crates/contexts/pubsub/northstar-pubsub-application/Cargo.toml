[package]
name = "northstar-pubsub-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PubSub, PEP, profile and private-storage application services for Northstar"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4" }
northstar-pubsub-core = { path = "../northstar-pubsub-core" }
northstar-runtime = { path = "../../../platform/northstar-runtime" }
northstar-telemetry = { path = "../../../platform/northstar-telemetry" }
northstar-xep-0060 = { path = "../../../kernel/northstar-xep-0060" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
sha1 = "0.10"
tokio = { version = "1.43", features = ["sync", "time"] }
uuid = { version = "1.12", features = ["v4"] }

[features]
# Exposes the repository behind a service to root-crate tests.
test-support = []

[dev-dependencies]
northstar-runtime = { path = "../../../platform/northstar-runtime", features = ["test-support"] }
tokio = { version = "1.43", features = ["macros", "rt"] }
