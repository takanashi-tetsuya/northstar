[package]
name = "northstar-auth-xmpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "SASL2 and in-band registration parsing and wire forms of client sessions for Northstar"
publish = false

[features]
# Test-only entry points the root crate's cross-context auth tests use.
test-support = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
northstar-time = { path = "../../../kernel/northstar-time" }
northstar-auth-application = { path = "../northstar-auth-application" }
northstar-auth-core = { path = "../northstar-auth-core" }
northstar-roster-core = { path = "../../roster/northstar-roster-core" }
northstar-runtime = { path = "../../../platform/northstar-runtime" }
northstar-telemetry = { path = "../../../platform/northstar-telemetry" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
tokio = { version = "1.43", features = ["macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
northstar-security = { path = "../../../platform/northstar-security" }
tokio = { version = "1.43", features = ["macros", "rt", "sync", "test-util", "time"] }
