northstar-security = { path = "crates/platform/northstar-security" }
northstar-telemetry = { path = "crates/platform/northstar-telemetry" }
northstar-web-surface = { path = "crates/platform/northstar-web-surface" }
northstar-message-core = { path = "crates/contexts/message/northstar-message-core" }
northstar-message-application = { path = "crates/contexts/message/northstar-message-application" }
northstar-session-core = { path = "crates/contexts/session/northstar-session-core" }
northstar-delivery-core = { path = "crates/contexts/message/northstar-delivery-core" }
northstar-presence-core = { path = "crates/contexts/roster/northstar-presence-core" }
northstar-room-core = { path = "crates/contexts/room/northstar-room-core" }
northstar-room-application = { path = "crates/contexts/room/northstar-room-application" }
northstar-pubsub-application = { path = "crates/contexts/pubsub/northstar-pubsub-application" }
northstar-pubsub-core = { path = "crates/contexts/pubsub/northstar-pubsub-core" }
northstar-roster-core = { path = "crates/contexts/roster/northstar-roster-core" }
northstar-roster-application = { path = "crates/contexts/roster/northstar-roster-application" }
northstar-archive-core = { path = "crates/contexts/archive/northstar-archive-core" }
northstar-archive-application = { path = "crates/contexts/archive/northstar-archive-application" }
northstar-upload-core = { path = "crates/contexts/upload/northstar-upload-core" }
northstar-upload-application = { path = "crates/contexts/upload/northstar-upload-application" }
northstar-session-application = { path = "crates/contexts/session/northstar-session-application" }
northstar-federation-core = { path = "crates/contexts/federation/northstar-federation-core" }
northstar-federation-application = { path = "crates/contexts/federation/northstar-federation-application" }
northstar-protocol-runtime = { path = "crates/contexts/session/northstar-protocol-runtime" }
# Ceremony state is serialized only into the server-side PostgreSQL challenge table.
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
# Keep native distributions independent of a system OpenSSL installation.
openssl = { version = "0.10.81", features = ["vendored"] }

[dev-dependencies]
northstar-runtime = { path = "crates/platform/northstar-runtime", features = ["test-support"] }
northstar-security = { path = "crates/platform/northstar-security", features = ["test-support"] }
# Deterministic cancellation/deadline experiments run on a paused test clock.
tokio = { version = "1.43", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Capacity fixtures use optimized runtime code while retaining development
# assertions and overflow checks. Ordinary builds/tests keep their profiles.
[profile.runtime-test]
inherits = "dev"
opt-level = 2
debug-assertions = true
overflow-checks = true
panic = "unwind"
