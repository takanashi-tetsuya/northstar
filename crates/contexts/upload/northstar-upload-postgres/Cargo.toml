[package]
name = "northstar-upload-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PostgreSQL persistence of HTTP upload slots, storage jobs and capacity authority for Northstar"
publish = false

[features]
# Constants and the module source the root crate's cross-context upload tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = "0.4"
northstar-auth-core = { path = "../../auth/northstar-auth-core" }
northstar-postgres = { path = "../../../platform/northstar-postgres" }
northstar-upload-application = { path = "../northstar-upload-application" }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1.12", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
