    VH09: "BOSH response FIFO records typed ownership before push; RID replay/response ACK behavior requires runtime evidence"
    VH10: "0136 exact token update before SM cascade plus 0138 catalog recognition are mapped; teardown behavior requires runtime evidence"
    VH11: "0136 UPDATE joins both delivery_id and mix_delivery_lease_token, so an old teardown cannot match a rotated owner; runtime race proof required"
    VH12: "terminal/source deletion paths are mapped to exact CAS methods; deletion/retry non-resurrection requires runtime evidence"
    VH13: "shared attempt deadline and cancellation-aware database turn are mapped; live shutdown/transport cleanup requires runtime evidence"
    VH14: "SocketFenced and SocketWritten are explicitly distinct; no end-to-end exactly-once assertion is made"
    VH15: "database CAS is mapped, but external-writer fencing after lease expiry remains a runtime evidence requirement"
    VH16: "claim query scopes strict predecessors by recipient_jid and sequence; multi-transport ordering requires runtime evidence"
    VH17: "route classification maps no target/unknown/unsupported to park rather than acknowledgement; runtime retry/terminal behavior required"
    VH18: "cluster protocol v13 path rejects legacy unfenced completion; incompatibility fixture required"
    VH19: "volatile and durable sources are distinct OutboundItem/NodeDeliveryContract variants; runtime confirmation required"
    VH20: "claim eligibility treats active SM/BOSH/cluster fences as blocking despite event expiry; final expiry/cleanup progress requires runtime evidence"
