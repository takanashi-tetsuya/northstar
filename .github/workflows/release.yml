name: Release preparation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      owner: ${{ steps.release.outputs.owner }}
    steps:
      - name: Check out triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and derive release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml package version is missing or is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          publish=false
          tag=""
          version="$package_version"

          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            publish=true
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$package_version" ]]; then
              echo "release tag $tag must exactly match Cargo.toml version v$package_version" >&2
              exit 1
            fi
            git show-ref --verify --quiet "refs/tags/$tag" || {
              echo "triggering ref did not resolve to local tag $tag" >&2
              exit 1
            }
            if [[ "$(git rev-parse "$tag^{commit}")" != "$commit" ]]; then
              echo "checked-out commit does not match $tag" >&2
              exit 1
            fi
            release_series="${package_version%.*}"
            release_series_changelog="changelog/v${release_series}.md"
            for release_doc in CHANGELOG.md "$release_series_changelog" README.md; do
              test -f "$release_doc" || {
                echo "required release document is missing: $release_doc" >&2
                exit 1
              }
              if grep -Fi 'Unreleased' "$release_doc" >/dev/null; then
                echo "$release_doc still marks $package_version as Unreleased" >&2
                exit 1
              fi
            done
            grep -F "## [$package_version] -" CHANGELOG.md >/dev/null || {
              echo "CHANGELOG.md has no dated $package_version release heading" >&2
              exit 1
            }
            grep -F "**Package version:** \`$package_version\`" "$release_series_changelog" >/dev/null || {
              echo "$release_series_changelog does not identify package $package_version" >&2
              exit 1
            }
            grep -F "current release is \`$package_version\`" README.md >/dev/null || {
              echo "README.md does not identify $package_version as the current release" >&2
              exit 1
            }
          fi

          for dockerfile in Dockerfile deploy/backup.Dockerfile deploy/database-grants.Dockerfile; do
            if ! grep -Fx "ARG NORTHSTAR_VERSION=$package_version" "$dockerfile" >/dev/null; then
              echo "$dockerfile default image version does not match Cargo.toml" >&2
              exit 1
            fi
          done

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          source_date_epoch="$(git show -s --format=%ct "$commit")"
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "short_sha=${commit:0:12}"
            echo "source_date_epoch=$source_date_epoch"
            echo "owner=$owner"
          } >>"$GITHUB_OUTPUT"

          if [[ "$publish" == true ]]; then
            echo "Validated tag $tag at $commit for draft release preparation." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run for $commit; no GHCR package or GitHub Release will be published." >>"$GITHUB_STEP_SUMMARY"
          fi

  build-binaries:
    name: Build ${{ matrix.label }} package
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux AMD64
            id: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows AMD64
            id: windows-amd64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: "0"
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Check out immutable source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust 1.97.1 target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build locked release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux binary version identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rust-xmpp-server"
          actual="$("$binary" --version)"
          expected="xmpp-server $RELEASE_VERSION"
          if [[ "$actual" != "$expected" ]]; then
            echo "binary version mismatch: expected '$expected', got '$actual'" >&2
            exit 1
          fi

      - name: Verify Windows binary version identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = "target\${{ matrix.target }}\release\rust-xmpp-server.exe"
          $actual = (& $binary --version).Trim()
          $expected = "xmpp-server $env:RELEASE_VERSION"
          if ($actual -ne $expected) {
            throw "binary version mismatch: expected '$expected', got '$actual'"
          }

      - name: Package complete Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          asset="northstar-${RELEASE_VERSION}-linux-amd64.tar.gz"
          raw_asset="northstar-${RELEASE_VERSION}-linux-amd64"
          stage="$RUNNER_TEMP/northstar-linux-amd64"

          mkdir -p dist "$stage/web" "$stage/third_party/swagger-ui"
          strip "target/${{ matrix.target }}/release/rust-xmpp-server"
          install -m 0755 "target/${{ matrix.target }}/release/rust-xmpp-server" "dist/$raw_asset"
          install -m 0755 "dist/$raw_asset" "$stage/xmpp-server"
          install -m 0644 .env.example README.md LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          cp -a web/. "$stage/web/"
          cp -a third_party/swagger-ui/dist "$stage/third_party/swagger-ui/"
          install -m 0644 third_party/swagger-ui/LICENSE third_party/swagger-ui/NOTICE \
            "$stage/third_party/swagger-ui/"

          tar --sort=name --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner \
            -C "$stage" -cf - . \
            | gzip -n >"dist/$asset"
          tar -tzf "dist/$asset" | grep -Fx './xmpp-server' >/dev/null
          tar -tzf "dist/$asset" | grep -Fx './web/index.html' >/dev/null
          tar -tzf "dist/$asset" | grep -Fx './third_party/swagger-ui/dist/swagger-ui.css' >/dev/null
          tar -tzf "dist/$asset" | grep -Fx './.env.example' >/dev/null

      - name: Package complete Windows distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "northstar-$env:RELEASE_VERSION-windows-amd64.zip"
          $rawAsset = "northstar-$env:RELEASE_VERSION-windows-amd64.exe"
          $stage = Join-Path $env:RUNNER_TEMP 'northstar-windows-amd64'
          New-Item -ItemType Directory -Force -Path dist, $stage | Out-Null

          Copy-Item -LiteralPath "target\${{ matrix.target }}\release\rust-xmpp-server.exe" `
            -Destination (Join-Path dist $rawAsset)
          Copy-Item -LiteralPath (Join-Path dist $rawAsset) `
            -Destination (Join-Path $stage 'xmpp-server.exe')
          Copy-Item -LiteralPath web -Destination $stage -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'third_party\swagger-ui') | Out-Null
          Copy-Item -LiteralPath 'third_party\swagger-ui\dist' `
            -Destination (Join-Path $stage 'third_party\swagger-ui') -Recurse
          Copy-Item -LiteralPath 'third_party\swagger-ui\LICENSE', `
            'third_party\swagger-ui\NOTICE' -Destination (Join-Path $stage 'third_party\swagger-ui')
          Copy-Item -LiteralPath '.env.example', 'README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md' `
            -Destination $stage

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path (Resolve-Path dist) $asset
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stage,
            $archive,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = $zip.Entries.FullName
            foreach ($required in @(
              'xmpp-server.exe',
              'web/index.html',
              'third_party/swagger-ui/dist/swagger-ui.css',
              '.env.example'
            )) {
              if ($entries -notcontains $required) {
                throw "release archive is missing $required"
              }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Preserve package for release assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-images:
    name: Publish ${{ matrix.image }} image
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: northstar
            dockerfile: Dockerfile
          - image: northstar-backup
            dockerfile: deploy/backup.Dockerfile
          - image: northstar-database-grants
            dockerfile: deploy/database-grants.Dockerfile
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate exact version and commit tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build and push linux/amd64 image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            NORTHSTAR_VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ needs.prepare.outputs.commit }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      - name: Sign and publish image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-digest
          printf '%s@%s\n' \
            'ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}' \
            '${{ steps.image.outputs.digest }}' \
            >'image-digest/${{ matrix.image }}.txt'

      - name: Preserve image digest for release assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-digest-${{ matrix.image }}
          path: image-digest/${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 14

  assemble-release-assets:
    name: Checksum and attest packages
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-binaries.result == 'success' &&
      (needs.prepare.outputs.publish != 'true' || needs.publish-images.result == 'success')
    needs:
      - prepare
      - build-binaries
      - publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true

      - name: Download published image digests
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Generate and verify SHA-256 checksums
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          linux_asset="northstar-${RELEASE_VERSION}-linux-amd64.tar.gz"
          linux_binary="northstar-${RELEASE_VERSION}-linux-amd64"
          windows_asset="northstar-${RELEASE_VERSION}-windows-amd64.zip"
          windows_binary="northstar-${RELEASE_VERSION}-windows-amd64.exe"
          test -f "dist/$linux_asset"
          test -f "dist/$linux_binary"
          test -f "dist/$windows_asset"
          test -f "dist/$windows_binary"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4

          assets=("$linux_asset" "$linux_binary" "$windows_asset" "$windows_binary")
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            mapfile -t digest_files < <(find image-digests -maxdepth 1 -type f -name '*.txt' | sort)
            test "${#digest_files[@]}" -eq 3
            cat "${digest_files[@]}" | sort >dist/IMAGE_DIGESTS
            test "$(wc -l <dist/IMAGE_DIGESTS)" -eq 3
            test "$(grep -Ec '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$' dist/IMAGE_DIGESTS)" -eq 3
            assets+=(IMAGE_DIGESTS)
          fi

          (
            cd dist
            sha256sum "${assets[@]}" >SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Sign package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload verified dry-run or release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  prepare-draft-release:
    name: Create or update draft GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - assemble-release-assets
      - publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Re-check immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Create or update draft and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" \
             || "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
            echo "$RELEASE_TAG moved after release validation" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

          release_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            create_options=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --draft
              --title "Northstar $RELEASE_VERSION"
              --generate-notes
            )
            gh "${create_options[@]}"
          else
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "refusing to overwrite already-published release $RELEASE_TAG" >&2
              exit 1
            fi
            release_id="$(jq -r '.id' <<<"$release_json")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f name="Northstar $RELEASE_VERSION" \
              -F draft=true \
              -F prerelease=false >/dev/null
          fi

          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Draft release $RELEASE_TAG is ready for manual review and publication." \
            >>"$GITHUB_STEP_SUMMARY"
