[package]
name = "northstar-federation-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Typed commands, envelopes, and application boundaries for XMPP S2S federation"
publish = false

[dependencies]
anyhow = "1.0"
dashmap = "6.1"
northstar-federation-core = { path = "../northstar-federation-core" }
northstar-telemetry = { path = "../../../platform/northstar-telemetry" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43", features = ["sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
