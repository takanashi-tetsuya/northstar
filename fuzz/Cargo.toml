[package]
name = "northstar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
idna = "1.1"
libfuzzer-sys = "0.4.13"
pbkdf2 = { version = "0.12", features = ["hmac"] }
precis-profiles = "0.1.13"
rand = "0.8"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"

[[bin]]
name = "xml_framing"
path = "fuzz_targets/xml_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_stanza"
path = "fuzz_targets/semantic_stanza.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bosh_ws_framing"
path = "fuzz_targets/bosh_ws_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rest_extractors"
path = "fuzz_targets/rest_extractors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sasl_sm_state"
path = "fuzz_targets/sasl_sm_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mam_pubsub_parsing"
path = "fuzz_targets/mam_pubsub_parsing.rs"
test = false
doc = false
bench = false
