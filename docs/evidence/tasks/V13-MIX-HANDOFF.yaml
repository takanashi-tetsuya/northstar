  call_graph:
    claimed_source: "src/xmpp/protocol/mix.rs::process_claimed_mix_delivery receives ClaimedMixDelivery(delivery_id, lease_token) from MixService::claim_mix_deliveries and keeps one absolute attempt deadline."
    renewal_and_finalization: "run_claimed_mix_effect_with_lease renews only the current token; process_claimed_mix_delivery chooses acknowledge/defer/retry/dead-letter only through MixService CAS methods, and retains the row on cancellation/deadline uncertainty."
    direct_socket: "src/xmpp/mod.rs fences the exact source through MixService::fence_mix_socket_write before completing OutboundItem::MixTransportHandoff as SocketFenced; the old claimant stops finalization once the rotated source transfers."
    stream_management: "src/db/sm.rs stores mix_delivery_id and mix_delivery_lease_token with the SM stanza; src/xmpp/protocol/sm.rs owns checkpoint/resume/ACK processing; migration 0136 releases only the matching pre-cascade source lease on SM parent teardown."
    bosh: "src/bosh.rs::record_and_push_item calls MixService::transfer_mix_delivery_to_bosh before retaining the response FIFO and completes only BoshPersisted; response acknowledgement later owns final source handling."
    cluster: "src/cluster.rs validates the signed v13 delivery identity, calls MixService::transfer_mix_delivery_to_cluster before local transport enqueue, and calls release_mix_cluster_delivery only with the exact delivery/node/request identity when no local durable boundary is reached."
    transport_boundary: "src/outbound.rs::MixTransportHandoff is one-shot; Queue/Redis admission is not a completion. SocketFenced, SmPersisted, and BoshPersisted are distinct boundaries; SocketWritten alone is explicitly insufficient for remote cluster hand-off acceptance."
  ownership_transition_table:
    claimed: "recipient row plus live lease_token; recoverable but not delivered"
    cluster_fenced: "rotated token plus delivery_id/node_id/request_id fence; remote responsibility acquired, not peer confirmation"
    queued: "in-memory OutboundItem is not recovery authority; persistent source/fence remains authoritative"
    socket_fenced: "rotated socket writer source; fencing established, not proof that bytes reached the peer"
    sm_persisted: "exact source stored with SM sequence; ACK remains separate"
    bosh_persisted: "exact source bound to BOSH session/RID response ownership; response ACK remains separate"
    terminal: "acknowledge/dead-letter policy result only after its applicable CAS/fence contract"
  vh_mapping:
    VH01: "cluster transfer is after source claim and before destination enqueue; Redis receipt alone is not terminal (runtime required)"
    VH02: "transfer_mix_delivery_to_cluster rotates the token atomically; renew/complete/release CAS paths require the exact current identity (runtime required)"
