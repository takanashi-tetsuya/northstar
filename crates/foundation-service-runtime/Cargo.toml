[package]
name = "foundation-service-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Northstar microservices standard service runtime, configuration, and health lifecycle"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["sync", "macros", "rt", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
thiserror = "2.0"
