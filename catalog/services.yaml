    implementation_status: executable-prototype
    code_path: "services/xmpp-edge"
    cargo_package: "service-xmpp-edge"
    name: "XMPP C2S Edge Connection Gateway"
    execution_class: transport
    home_key: connection_id
    database: none
    owner_team: edge-platform
    criticality: critical
    data_classes:
      - none
    region_mode: global
    runtime_binary: "target/release/xmpp-edge"
    image: "ghcr.io/takanashi-tetsuya/northstar/xmpp-edge:${VERSION:-latest}"
    deployment_unit: edge-gateway
    semantic_owner: xmpp-edge
    evidence:
      status: executable-prototype
      required_checks:
        - catalog-validator
        - cargo-check
    rpc:
      consumes:
        - northstar.identity.v1.IdentityService
        - northstar.session.v1.SessionDirectoryService
        - northstar.registry.v1.ProtocolRegistryService
        - northstar.ingress.v1.MessageIngressService
      provides:
        - northstar.edge.v1.EdgeDeliveryService
    events:
      produces:
        - edge.connection.v1
    slo:
      command_p99_ms: 20
      availability: 99.99

