        - "ebea305"
        - "a71a016"
        - "a1b5934"
        - "da5995e"
        - "6cc8e54"
      result: "The identified W5 fixture migrations are implemented: MIX runtime, MIX federation, two-domain S2S, integration/load, component, browser, message-PoW, moderation, OMEMO, profile-storage, PubSub-wire, MUC Redis, cluster Redis TLS/mTLS, and the local database-role fixture use child-owned endpoints, stable relays, or private Unix sockets. Public origins are checked through fixture-owned relays, and a shared atomic target handoff prevents partial target reads. The required Linux execution evidence is still pending."
      implementation_scope_completed:
        - "cluster two-node Redis TLS/mTLS and Northstar listener fixture"
        - "stable public-origin relay handoff for migrated runtime fixtures"
        - "bounded relay startup diagnostic cleanup"
      audit_limit: "Fixture implementation is not pressure evidence. The S2S/MIX matrix does not establish cluster/Redis pressure, and cluster/Redis behavior requires its own bounded Linux run."
      required_validation:
        - "50 parallel dual-node fixtures for 20 ordinary-CI rounds without EADDRINUSE."
        - "100 scheduled-stress rounds without EADDRINUSE."
        - "Occupied-port, invalid readiness nonce/PID/address, and three child-crash phase probes."
        - "Listener tests with --test-threads=16 without sleep-based synchronization."
        - "Independent, isolated, bounded results for Privacy, HTTP Upload, MUC cluster, PubSub outbox, and PubSub wire."
