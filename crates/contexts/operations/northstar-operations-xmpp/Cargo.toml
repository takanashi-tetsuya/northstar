[package]
name = "northstar-operations-xmpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "XEP-0050 and XEP-0133 administrative command handlers of client sessions for Northstar"
publish = false

[dependencies]
anyhow = "1.0"
northstar-time = { path = "../../../kernel/northstar-time", features = ["serde"] }
dashmap = "6.1"
northstar-auth-core = { path = "../../auth/northstar-auth-core" }
northstar-operations-application = { path = "../northstar-operations-application" }
northstar-room-core = { path = "../../room/northstar-room-core" }
northstar-runtime = { path = "../../../platform/northstar-runtime" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-stream = { path = "../../../edges/northstar-stream" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
northstar-session-application = { path = "../../session/northstar-session-application" }
