[package]
name = "northstar-security"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Security mechanisms for the Northstar XMPP server"
publish = false

[dependencies]
anyhow = "1.0"
arc-swap = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["dnssec-aws-lc-rs", "system-config", "tokio"] }
libc = "0.2"
northstar-xmpp-types = { path = "../../kernel/northstar-xmpp-types" }
# Keep native distributions independent of a system OpenSSL installation.
openssl = { version = "0.10.81", features = ["vendored"] }
ring = "0.17.14"
rustls-webpki = "0.103"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
webpki-roots = "1"
x509-parser = { version = "0.18.1", default-features = false }
zeroize = "1.8"

[features]
# Key material that tests in dependent crates use.
test-support = []
