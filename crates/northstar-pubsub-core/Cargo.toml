[package]
name = "northstar-pubsub-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Core PubSub/PEP domain types and outcomes"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
northstar-xmpp-types = { path = "../northstar-xmpp-types" }
uuid = { version = "1.12", features = ["v4", "serde"] }
