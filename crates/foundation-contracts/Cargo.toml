[package]
name = "foundation-contracts"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Typed RPC and Event Contracts for Northstar Microservices"
publish = false

[dependencies]
foundation-security = { path = "../foundation-security" }
foundation-eventing = { path = "../foundation-eventing" }
foundation-telemetry = { path = "../foundation-telemetry" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
