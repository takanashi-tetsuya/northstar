    execution_class: stateful-hot
    home_key: recipient_bare_jid
    database: northstar_delivery
    rpc:
      provides:
        - northstar.delivery.v1.DeliveryRouterService
      consumes:
        - northstar.edge.v1.EdgeDeliveryService
        - northstar.session.v1.SessionDirectoryService
    events:
      consumes:
        - message.accepted.v1
        - session.lifecycle.v1
      produces:
        - delivery.status.v1
    slo:
      command_p99_ms: 50
      availability: 99.95

