[package]
name = "northstar-archive-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PostgreSQL persistence of personal message archives, MAM preferences and MAM queries for Northstar"
publish = false

[features]
# Test-only archive writes and room reads for northstar-db-it and root S2S acceptance tests.
test-support = []

[dependencies]
anyhow = "1.0"
northstar-archive-application = { path = "../northstar-archive-application" }
northstar-archive-core = { path = "../northstar-archive-core" }
northstar-message-core = { path = "../../message/northstar-message-core" }
northstar-time = { path = "../../../kernel/northstar-time", features = ["postgres"] }
northstar-xep-0313 = { path = "../../../kernel/northstar-xep-0313" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
uuid = "1.12"
