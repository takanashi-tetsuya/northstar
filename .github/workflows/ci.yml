          NORTHSTAR_CI_COMMAND_TIMEOUT_SECONDS: "900"
        run: |
          bash scripts/github-ci-run.sh "XEP-0487 privileged HTTPS runtime" sudo env \
            XEP0487_RUNTIME_UID="$(id -u)" \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            NORTHSTAR_XEP0487_SKIP_BUILD=true \
            XMPP_TEST_SYSTEM_TOOLCHAIN=true \
