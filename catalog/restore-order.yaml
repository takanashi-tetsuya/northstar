version: "2.0.0"

# Every stateful logical database has encrypted base backup + PITR/WAL,
# deletion/crypto-shredding propagation, and a post-restore fencing check.
# restore-verifier enforces unique phases and dependency ordering.
entries:
  - database: northstar_identity
    restore_order: 10
    cluster_class: primary-home
    pitr: true
    base_backup: true
    wal_archiving: true
    encrypted: true
    retention_days: 365
    deletion_ledger: true
    fence_check: credential_generation
  - database: northstar_session
    restore_order: 20
    cluster_class: primary-home
    pitr: true
    base_backup: true
    wal_archiving: true
    encrypted: true
    retention_days: 90
    dependencies: [northstar_identity]
    deletion_ledger: true
    fence_check: region_epoch
