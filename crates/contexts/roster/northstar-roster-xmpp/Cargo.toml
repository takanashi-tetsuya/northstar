[package]
name = "northstar-roster-xmpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Roster, presence, privacy list and blocking handlers of client sessions for Northstar"
publish = false

[dependencies]
anyhow = "1.0"
northstar-presence-core = { path = "../northstar-presence-core" }
northstar-roster-application = { path = "../northstar-roster-application" }
northstar-roster-core = { path = "../northstar-roster-core" }
northstar-xep-0016 = { path = "../../../kernel/northstar-xep-0016" }
northstar-xep-0191 = { path = "../../../kernel/northstar-xep-0191" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }
