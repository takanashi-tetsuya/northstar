[package]
name = "northstar-xep-0198"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Capability-free XEP-0198 Stream Management wire protocol and state machine for Northstar"
publish = false

[package.metadata.northstar-xep]
id = 198
route-ids = [
    "stream|urn:xmpp:sm:3|enable",
    "stream|urn:xmpp:sm:3|resume",
    "stream|urn:xmpp:sm:3|r",
    "stream|urn:xmpp:sm:3|a",
]
worker-ids = []

[dependencies]
northstar-xep-core = { path = "../northstar-xep-core" }
roxmltree = "0.20"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
