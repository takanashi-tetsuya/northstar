[package]
name = "architecture-validator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Generate and validate Northstar compile-time, runtime, and data-access dependency graphs"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0"

