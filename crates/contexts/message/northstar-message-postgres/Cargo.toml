[package]
name = "northstar-message-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PostgreSQL persistence of Northstar's offline queue, personal admissions, push and spool wakes."
publish = false

[features]
# Test-only entry points the root crate's integration tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
northstar-abuse-policy = { path = "../../abuse/northstar-abuse-policy" }
northstar-federation-core = { path = "../../federation/northstar-federation-core" }
northstar-message-application = { path = "../northstar-message-application" }
northstar-message-core = { path = "../northstar-message-core" }
northstar-postgres = { path = "../../../platform/northstar-postgres" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
