# Northstar dependency-policy gate. Keep this intentionally small: every
# exception must include a crate-specific reason rather than weakening a lint
# globally.

[graph]
all-features = true

[advisories]
ignore = [
    # Informational "unmaintained" notices, no vulnerability. chrono carries the
    # timestamps of 51 workspace crates and SQLx's `chrono` feature; moving to
    # `time` (already locked) is planned as its own stage.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration to time planned" },
    # humantime is flagged only because it wraps chrono; object_store pulls it
    # in and Northstar never calls it.
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained via chrono; object_store only" },
]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
