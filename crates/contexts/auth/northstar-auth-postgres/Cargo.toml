[package]
name = "northstar-auth-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PostgreSQL persistence of Northstar accounts, API sessions, credentials and revocations."
publish = false

[features]
# Test-only entry points for northstar-db-it authentication and source-contract tests.
test-support = []

[dependencies]
anyhow = "1.0"
northstar-time = { path = "../../../kernel/northstar-time", features = ["serde", "postgres"] }
northstar-auth-application = { path = "../northstar-auth-application" }
northstar-auth-core = { path = "../northstar-auth-core" }
northstar-config = { path = "../../../platform/northstar-config" }
northstar-security = { path = "../../../platform/northstar-security" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros"] }
subtle = "2.6"
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
northstar-postgres = { path = "../../../platform/northstar-postgres" }
tokio = { version = "1.43", features = ["macros", "rt"] }
