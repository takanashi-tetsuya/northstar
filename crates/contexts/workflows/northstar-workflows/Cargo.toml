[package]
name = "northstar-workflows"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Transactions that span Northstar's bounded contexts."
publish = false

[features]
# Test-only entry points the root crate's cross-context tests use.
test-support = ["northstar-room-postgres/test-support", "northstar-roster-postgres/test-support"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
northstar-abuse-application = { path = "../../abuse/northstar-abuse-application" }
northstar-abuse-policy = { path = "../../abuse/northstar-abuse-policy" }
northstar-abuse-postgres = { path = "../../abuse/northstar-abuse-postgres" }
northstar-archive-application = { path = "../../archive/northstar-archive-application" }
northstar-archive-core = { path = "../../archive/northstar-archive-core" }
northstar-archive-postgres = { path = "../../archive/northstar-archive-postgres" }
northstar-auth-application = { path = "../../auth/northstar-auth-application" }
northstar-auth-core = { path = "../../auth/northstar-auth-core" }
northstar-auth-postgres = { path = "../../auth/northstar-auth-postgres" }
northstar-config = { path = "../../../platform/northstar-config" }
northstar-message-application = { path = "../../message/northstar-message-application" }
northstar-delivery-core = { path = "../../message/northstar-delivery-core" }
northstar-federation-core = { path = "../../federation/northstar-federation-core" }
northstar-federation-postgres = { path = "../../federation/northstar-federation-postgres" }
northstar-message-core = { path = "../../message/northstar-message-core" }
northstar-message-postgres = { path = "../../message/northstar-message-postgres" }
northstar-operations-application = { path = "../../operations/northstar-operations-application" }
northstar-operations-core = { path = "../../operations/northstar-operations-core" }
northstar-operations-postgres = { path = "../../operations/northstar-operations-postgres" }
northstar-postgres = { path = "../../../platform/northstar-postgres" }
northstar-pubsub-application = { path = "../../pubsub/northstar-pubsub-application" }
northstar-pubsub-postgres = { path = "../../pubsub/northstar-pubsub-postgres" }
northstar-pubsub-core = { path = "../../pubsub/northstar-pubsub-core" }
northstar-room-application = { path = "../../room/northstar-room-application" }
northstar-room-core = { path = "../../room/northstar-room-core" }
northstar-room-postgres = { path = "../../room/northstar-room-postgres" }
northstar-roster-application = { path = "../../roster/northstar-roster-application" }
northstar-roster-core = { path = "../../roster/northstar-roster-core" }
northstar-roster-postgres = { path = "../../roster/northstar-roster-postgres" }
northstar-runtime = { path = "../../../platform/northstar-runtime" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-session-application = { path = "../../session/northstar-session-application" }
northstar-session-core = { path = "../../session/northstar-session-core" }
northstar-session-postgres = { path = "../../session/northstar-session-postgres" }
northstar-telemetry = { path = "../../../platform/northstar-telemetry" }
northstar-upload-postgres = { path = "../../upload/northstar-upload-postgres" }
northstar-xep-0016 = { path = "../../../kernel/northstar-xep-0016" }
northstar-xep-0060 = { path = "../../../kernel/northstar-xep-0060" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xmpp-avatar = { path = "../../../kernel/northstar-xmpp-avatar" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"] }
zeroize = "1.8"
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
futures = "0.3"
northstar-auth-application = { path = "../../auth/northstar-auth-application", features = ["test-support"] }
northstar-auth-postgres = { path = "../../auth/northstar-auth-postgres", features = ["test-support"] }
northstar-operations-postgres = { path = "../../operations/northstar-operations-postgres", features = ["test-support"] }
northstar-pubsub-postgres = { path = "../../pubsub/northstar-pubsub-postgres", features = ["test-support"] }
northstar-room-postgres = { path = "../../room/northstar-room-postgres", features = ["test-support"] }
northstar-roster-postgres = { path = "../../roster/northstar-roster-postgres", features = ["test-support"] }
northstar-session-postgres = { path = "../../session/northstar-session-postgres", features = ["test-support"] }
tokio = { version = "1.43", features = ["macros", "rt", "rt-multi-thread"] }
