openapi: 3.1.0
info:
  title: Northstar XMPP REST API
  version: 1.1.0
  description: |
    Account, anti-abuse, reporting, encrypted-history, HTTP Upload and administration API.
    Generic XMPP protocol features are documented separately in XEP_MATRIX.md.

    Every `/api/` response carries `X-Request-ID`. JSON request bodies reject unknown fields.
    Path/query decoding failures use the same non-diagnostic `bad_request` error object. Collection
    cursors are opaque, short-lived, scope-bound keyset cursors: clients must not inspect them and
    must repeat the same principal and filters when following `next_cursor`.

    Mutations referencing the optional `IdempotencyKey` parameter accept zero or one 8-200 byte visible-ASCII value. Mutations referencing `RequiredIdempotencyKey`, including upload dead-letter retry, require exactly one such value.
    On optional endpoints, omitting it gives the request a server-generated one-shot identity; a
    required endpoint rejects omission. Clients that need safe retry must send and retain their own
    key. A replay has `Idempotency-Replayed: true` and
    `Idempotency-Original-Request-ID`. Reusing a key for different bytes, media type, route, target,
    principal or authorization generation is rejected.
servers:
  - url: https://xmpp.example.com
paths:
  /.well-known/host-meta:
    get:
      summary: XMPP host-meta discovery document (XEP-0156)
      responses:
        "200": { description: XML XRD containing the WebSocket and optional BOSH links }
  /.well-known/host-meta.json:
    get:
      summary: XMPP host-meta discovery document as JRD (XEP-0156)
      responses:
        "200": { description: JSON JRD containing the WebSocket and optional BOSH links }
  /xmpp-websocket:
    get:
      summary: XMPP over WebSocket upgrade (RFC 7395)
      description: Requires the xmpp subprotocol, an allowed Origin when present, and WSS in production. This is an XMPP transport rather than a JSON REST operation.
      responses:
        "101": { description: WebSocket protocol upgrade accepted }
        "400": { description: Secure transport or the xmpp subprotocol is missing }
        "403": { description: Browser Origin is not permitted }
  /http-bind:
    post:
      summary: XMPP over BOSH (XEP-0124/XEP-0206)
      description: Optional XML binding endpoint. It is enabled with BOSH_ENABLED and accepts security-sensitive authentication only when a trusted reverse proxy reports HTTPS. This is an XMPP transport rather than a JSON REST operation.
      requestBody:
        required: true
        content:
          text/xml:
            schema: { type: string }
          application/xml:
            schema: { type: string }
      responses:
        "200":
          description: A BOSH body response, including protocol-level terminate conditions
          content:
            text/xml:
              schema: { type: string }
        "413": { description: Request exceeds the configured BOSH byte limit }
    options:
      summary: BOSH CORS preflight
      responses:
        "204": { description: CORS policy for the public BOSH endpoint }
  /bosh:
    post:
      summary: Alias for /http-bind
      requestBody:
        required: true
        content:
          text/xml:
            schema: { type: string }
          application/xml:
            schema: { type: string }
      responses:
        "200":
          description: A BOSH body response
          content:
            text/xml:
              schema: { type: string }
        "413": { description: Request exceeds the configured BOSH byte limit }
    options:
      summary: BOSH alias CORS preflight
      responses:
        "204": { description: CORS policy for the public BOSH endpoint }
  /healthz:
    get:
      summary: Process liveness probe
      responses:
        "200": { description: Process event loop is serving HTTP }
  /readyz:
    get:
      summary: PostgreSQL and supervised-worker readiness probe
      description: Internal orchestration endpoint. The default Caddy policy returns 404 for this path; trusted load balancers and container health checks reach the application listener directly. Duplicate probes share a two-second cache and one bounded single-flight database check.
      responses:
        "200": { description: Database query succeeded and registered workers are healthy }
        "503": { $ref: "#/components/responses/Error" }
  /metrics:
    get:
      summary: Prometheus text metrics
      description: Served only by the dedicated METRICS_BIND listener, never by the public HTTP router. A loopback listener accepts local scrapes; a non-loopback listener requires the independently mounted metrics bearer token.
      security: [{ metricsBearer: [] }, {}]
      responses:
        "200": { description: Prometheus text exposition }
        "401": { description: Missing or invalid metrics bearer token }
        "503": { description: A concurrent collector already holds the single-flight slot }
  /api:
    get:
      summary: Reserved API namespace root
      description: This sentinel keeps the reserved API namespace out of the static web-client fallback. Versioned operations begin at `/api/v1`; this path always returns the normal JSON not-found envelope.
      responses:
        "404": { $ref: "#/components/responses/Error" }
  /api/docs:
    get:
      summary: Browse the REST contract in the self-hosted Swagger UI
      description: Swagger UI 5.32.14 is served entirely from this Northstar instance under a documentation-specific CSP. Authorization controls, request submission, credential persistence and the external validator are disabled, so this is a read-only contract browser rather than an alternate API control plane.
      responses:
        "200":
          description: Read-only Swagger UI HTML shell
          content:
            text/html:
              schema: { type: string }
  /api/openapi.yaml:
    get:
      summary: Download the exact reviewed OpenAPI contract
      description: The response is the same checked-in file used by router-contract CI and by the self-hosted documentation UI. It is never fetched from or sent to a third party.
      responses:
        "200":
          description: Northstar OpenAPI 3.1 contract
          content:
            application/yaml:
              schema: { type: string }
  /api/v1/config:
    get:
      summary: Read public server configuration
      responses:
        "200":
          description: Public domain, registration, archive, WebSocket, MUC, upload and federation configuration
  /api/v1/register:
    post:
      summary: Register an account when open registration is enabled
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Registration" }
      responses:
        "201": { description: Account created }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/anti-abuse/challenge:
    post:
      summary: Issue a one-use proof-of-work challenge
      description: Registration and login challenges are public; login also requires username. Message, report, appeal and password-change challenges require a bearer session. A v2 request must send only a SHA-256 commitment to the canonical pow-less mutation body, never the password, report text, OMEMO envelope or other sensitive body. Method, canonical path, body digest, actor, subject, difficulty, issue/expiry times, random server nonce and key generation are bound into the one-use challenge. The optional v1 form is accepted only before the operator-configured migration deadline. A newer challenge replaces an older challenge for the same account action. The advertised max-device-seconds is an operator calibration target, not a timing guarantee for every device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [registration, login, message, report, appeal, password_change] }
                username: { type: [string, "null"], minLength: 1, maxLength: 1024, description: Required only for login; the prepared localpart must contain 3 to 64 UTF-8 octets }
                intent:
                  oneOf:
                    - { $ref: "#/components/schemas/PowIntent" }
                    - { type: "null" }
                  description: Required for v2. Omission/null requests deprecated v1 and fails after POW_V1_COMPATIBILITY_UNTIL.
      responses:
        "200":
          description: Versioned challenge, bound intent, key generation, issue/expiry times, current work/wait step, maximum work and cooldown information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PowChallenge" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/login:
    post:
      summary: Create an API bearer session
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Authenticated session. An exact replay returns the stored session response and identifies the original request in the two idempotency replay headers.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
            Idempotency-Original-Request-ID: { $ref: "#/components/headers/IdempotencyOriginalRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/session:
    delete:
      summary: Revoke the current API bearer session
      description: Deletes the presented bearer token immediately. Web and administrative clients should invoke this endpoint before discarding their local token.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Session revoked and logout audit attempted }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      summary: Read the current account
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current account }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me/password:
    patch:
      summary: Change the current password and revoke every API session
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 1024 }
                pow: { $ref: "#/components/schemas/PowProof" }
      responses:
        "200": { description: Password changed }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/me/omemo-recovery-authority:
    get:
      summary: Read the account's monotonic OMEMO device-transfer fence
      description: Returns only transfer generations, transfer IDs, and SHA-256 consumer commitments. Consumer secrets, private OMEMO state, the encrypted package, its passphrase and derived key are never returned or stored. A destination browser with a local transfer marker must check this endpoint before publishing the moved device.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current durable one-consumer high-water fence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OmemoRecoveryAuthority" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me/omemo-recovery-transfers:
    post:
      summary: Allocate a one-time OMEMO device-transfer generation
      description: The client-generated transfer UUID, source device ID and 256-bit source poll secret make an uncertain retry idempotent. Only an account/transfer-bound SHA-256 digest of that poll secret is stored. An account may have only one active allocation; it must be explicitly revoked or expire before a different UUID is accepted. This endpoint stores no encrypted package or private material.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OmemoRecoveryPrepare" }
      responses:
        "201": { description: Generation allocated }
        "200": { description: Exact transfer-UUID replay }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/me/omemo-recovery-transfers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read one owned OMEMO device-transfer record
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Server-blind transfer metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OmemoRecoveryTransfer" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Seal a transfer to the local encrypted package SHA-256
      description: Stores only the exact SHA-256 of the encrypted local file. The package itself remains on the user's devices.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OmemoRecoverySeal" }
      responses:
        "200": { description: Transfer sealed or exact replay }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke an unconsumed OMEMO device transfer
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Transfer revoked or already revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/me/omemo-recovery-transfers/{id}/consume:
    post:
      summary: Commit one destination as the transfer's sole consumer
      description: Atomically advances the account high-water fence, records only a SHA-256 commitment to a client-generated 256-bit destination secret, rotates the account authorization generation, and invalidates every API, FAST and resumable XMPP bearer authenticated before the move. Post-commit transport teardown is generation-scoped, so a replay cannot disconnect a destination which has logged in again. Because the committing bearer is intentionally revoked, an uncertain caller preserves its sealed destination state and reauthenticates before checking or replaying the exact secret/digest; reading every authenticated GET response is insufficient to forge that replay.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OmemoRecoveryConsume" }
      responses:
        "200": { description: Transfer consumed or exact same-consumer replay }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/omemo-recovery-transfers/{id}/poll:
    post:
      summary: Resolve one source transfer after its ordinary bearer was revoked
      description: Read-only capability endpoint. The 256-bit poll secret is sent only in the JSON body; the server stores only its account/transfer-bound SHA-256 digest. The response contains only state and generation, may be retried idempotently after a lost response, and expires no later than 24 hours after a terminal transition or 24 hours after the transfer expiry. No ordinary bearer is accepted or required. Before any database lookup, the trusted-proxy-resolved client IP is admitted through an independent 30-request sliding one-minute window and a four-request global concurrency gate. Polls use a separate two-connection database pool with a 1.5-second statement timeout. Unknown IDs, wrong secrets and expired capabilities share the same 404 response.
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OmemoRecoveryPoll" }
      responses:
        "200":
          description: Minimal source-observable transfer status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OmemoRecoveryPollStatus" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/history:
    get:
      summary: Read the current user's archived stanzas
      description: |
        Reuses the same repeatable-read, XEP-0191-aware query implementation as XMPP MAM.
        `with` accepts a canonical bare or full JID. `start`, `end`, `after_id`,
        `before_id` and `ids` are the XEP-0313 extended-form filters. RSM page
        selection uses exactly one of `page`, `before`, `after` or `index` and
        `max`; a referenced archive UID must belong to this account and be
        viewer-visible in the same snapshot. `flip=true` reverses only the
        returned page, while `first`, `last` and `first_index` remain
        chronological metadata.

        Existing clients may continue to send only `with`, `limit` and the
        opaque `cursor`. That legacy mode remains newest-first and returns a
        `next_cursor`; it is implemented by translating the authenticated
        cursor to the shared MAM `before` page, not by separate archive SQL.
        Direct MAM controls cannot be combined with `cursor`; `max` and
        `limit` are mutually exclusive. A direction filter is deliberately
        not advertised because historical archive rows do not carry an
        authoritative direction field. Unknown parameters, including
        `direction`, are rejected instead of being silently ignored.

        Under the default archive policy, returned message payloads contain an
        OMEMO envelope and a generic fallback body only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: with, schema: { type: string }, description: Canonical bare or full peer JID }
        - { in: query, name: start, schema: { type: string, format: date-time }, description: Inclusive archive timestamp lower bound }
        - { in: query, name: end, schema: { type: string, format: date-time }, description: Inclusive archive timestamp upper bound }
        - { in: query, name: after_id, schema: { type: string, format: uuid }, description: Extended-form lower archive UID bound, independent of RSM page selection }
        - { in: query, name: before_id, schema: { type: string, format: uuid }, description: Extended-form upper archive UID bound, independent of RSM page selection }
        - in: query
          name: ids
          style: form
          explode: false
          schema: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
          description: Comma-separated immutable archive UIDs; every UID must be visible in this archive
        - { in: query, name: page, schema: { type: string, enum: [first, last] }, description: RSM edge page; mutually exclusive with before, after and index }
        - { in: query, name: before, schema: { type: string, format: uuid }, description: RSM page strictly before this archive UID }
        - { in: query, name: after, schema: { type: string, format: uuid }, description: RSM page strictly after this archive UID }
        - { in: query, name: index, schema: { type: integer, minimum: 0, maximum: 1000000 }, description: Optional bounded XEP-0059 zero-based index page }
        - { in: query, name: max, schema: { type: integer, minimum: 0, maximum: 100, default: 100 }, description: MAM/RSM page size; zero returns only metadata }
        - { in: query, name: flip, schema: { type: boolean, default: false }, description: Return this page in reverse chronological order without changing RSM metadata }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 }, description: Legacy page-size alias retained for cursor clients; mutually exclusive with max }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Stable archive page and RSM metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error", description: One or more explicitly referenced archive UIDs are absent or not visible }
  /api/v1/reports:
    get:
      summary: List the current user's reports and appeals
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ReportStatus" } }
      responses:
        "200": { description: Reports, selected evidence and outcomes }
    post:
      summary: Submit a report with 1–20 explicitly selected chat records
      description: Every selected item must name a message_archive row owned by the reporter and associated with reported_jid. Plaintext is copied from the server archive. For OMEMO, body_text is user-decrypted and explicitly unverified; the server retains the archived ciphertext reference and SHA-256 digest. A single-use report proof-of-work challenge is required.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Report" }
      responses:
        "201": { description: Report submitted }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/reports/{id}/appeals:
    post:
      summary: Appeal one resolved report
      description: Only one appeal is permitted per report. Appeals have stricter account limits, proof of work and a minimum hard wait.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Appeal" }
      responses:
        "201": { description: Appeal submitted }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/upload/{id}:
    put:
      summary: Upload bytes into an XEP-0363 slot
      description: The bearer value is the opaque, short-lived slot capability returned inside the XMPP slot response, not a REST login token. Content-Type and the actual byte count must match the reservation; Content-Length, when sent, must also match. A byte-identical retry within the capability lifetime returns 201 and is marked as replayed; different bytes are rejected. Content-Range and non-identity Content-Encoding are rejected.
      security: [{ uploadSlot: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Bytes stored and ready at the slot GET URL, or a byte-identical completed PUT replay
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete one upload owned by the authenticated account
      description: Atomically removes the slot from the public download namespace, writes an audit record, and enqueues idempotent object cleanup. Missing UUIDs and uploads owned by another account both return 204 without changing state, preventing ownership enumeration. An already-open download may finish; future GET requests return 404. Because encrypted attachment URLs are carried inside OMEMO ciphertext, the server cannot discover or rewrite message references.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Upload is absent or durable cleanup was queued }
        "401": { $ref: "#/components/responses/Error" }
  /uploads/{id}:
    get:
      summary: Download bytes stored in an XEP-0363 slot
      description: The URL is intentionally bearer-by-possession. The bundled Web client uploads only AES-GCM ciphertext and carries its key inside OMEMO.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Immutable uploaded bytes }
        "404": { description: Slot is missing, expired before upload, or not uploaded }
  /api/v1/admin/stats:
    get:
      summary: Read server counters
      description: Includes the current runtime registration, federation, and island-mode switches in addition to durable and process-local counters.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Server statistics }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/nuke:
    post:
      summary: Disabled REST factory-reset placeholder
      description: This route always returns 503. Factory reset is available only through the staged operator recovery procedure; it cannot be enabled through the REST API.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "503": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/panic_disconnect:
    post:
      summary: Cancel all local XMPP client connections and invalidate resumable sessions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { $ref: "#/components/responses/AcceptedOperation" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/island_mode:
    post:
      summary: Enable or disable the runtime federation isolation switch
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BooleanToggle" }
      responses:
        "202": { $ref: "#/components/responses/AcceptedOperation" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/registration:
    post:
      summary: Open or close new registration at runtime
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BooleanToggle" }
      responses:
        "200": { description: Registration state updated and audited }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/sessions:
    get:
      summary: List local connected XMPP resources
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
