default-members = ["."]
resolver = "2"

[package]
name = "rust-xmpp-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "A single-node, standards-oriented XMPP server written in Rust"
repository = "https://github.com/takanashi-tetsuya/northstar"
homepage = "https://github.com/takanashi-tetsuya/northstar"
readme = "README.md"
publish = false

[dependencies]
northstar-abuse-policy = { path = "crates/northstar-abuse-policy" }
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "multipart"] }
arc-swap = "1"
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
dotenvy = "0.15"
futures = "0.3"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["dnssec-aws-lc-rs", "system-config", "tokio"] }
rand = "0.8"
ring = "0.17.14"
roxmltree = "0.20"
rustls-webpki = "0.103"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0"
subtle = "2.6"
hmac = "0.12"
idna = "1.1"
libc = "0.2"
pbkdf2 = { version = "0.12", features = ["hmac"] }
precis-profiles = "0.1.13"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
webpki-roots = "0.26"
zeroize = "1.8"
x509-parser = { version = "0.18.1", default-features = false }
tracing-appender = "0.2.5"
envy = "0.4.2"
redis = { version = "1.6.0", features = ["tokio-rustls-comp"] }
bb8 = "0.9.1"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
northstar-xep-0184 = { path = "crates/northstar-xep-0184" }
northstar-xep-0085 = { path = "crates/northstar-xep-0085" }
northstar-xep-0092 = { path = "crates/northstar-xep-0092" }
