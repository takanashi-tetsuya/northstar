[package]
name = "northstar-workflows"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Transactions that span Northstar's bounded contexts."
publish = false

[features]
# Test-only entry points the root crate's cross-context tests use.
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
northstar-abuse-application = { path = "../../abuse/northstar-abuse-application" }
northstar-abuse-policy = { path = "../../abuse/northstar-abuse-policy" }
northstar-abuse-postgres = { path = "../../abuse/northstar-abuse-postgres" }
northstar-archive-postgres = { path = "../../archive/northstar-archive-postgres" }
northstar-auth-application = { path = "../../auth/northstar-auth-application" }
northstar-auth-core = { path = "../../auth/northstar-auth-core" }
northstar-auth-postgres = { path = "../../auth/northstar-auth-postgres" }
northstar-message-application = { path = "../../message/northstar-message-application" }
northstar-operations-application = { path = "../../operations/northstar-operations-application" }
northstar-operations-core = { path = "../../operations/northstar-operations-core" }
northstar-operations-postgres = { path = "../../operations/northstar-operations-postgres" }
northstar-postgres = { path = "../../../platform/northstar-postgres" }
northstar-room-application = { path = "../../room/northstar-room-application" }
northstar-room-postgres = { path = "../../room/northstar-room-postgres" }
northstar-roster-core = { path = "../../roster/northstar-roster-core" }
northstar-roster-postgres = { path = "../../roster/northstar-roster-postgres" }
northstar-security = { path = "../../../platform/northstar-security" }
northstar-upload-postgres = { path = "../../upload/northstar-upload-postgres" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros"] }
zeroize = "1.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
