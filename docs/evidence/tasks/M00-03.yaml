scope:
  guarantees:
    - "A fixture does not claim that a released numeric port is reserved."
    - "Child-owned listeners publish resolved addresses only through a nonce- and PID-bound readiness record."
    - "A direct fixture parent exit is not treated as group completion while a private-group descendant remains alive."
    - "A failed database suite does not hide later isolated suites in the same declared shard."
  exclusions:
    - "This task does not weaken HTTPS, TLS, account-deletion, data-isolation, or collection-child-limit assertions."
    - "Windows inherited-handle activation remains unimplemented until its named control channel has equivalent ownership proof."
work_units:
  completed:
    - id: "M00-03.W1"
      result: "Harness readiness protocol, bounded in-process handoff, and exclusive pre-bound test listeners."
    - id: "M00-03.W2"
      result: "Runtime listener ownership, nonce-bound child readiness, and XEP-0487 migration away from the repeated port allocator."
    - id: "M00-03.W3"
      result: "Linux-only XEP-0487 socket activation: root retains the exclusive loopback 443 listener until a non-root TLS child writes a nonce-, PID-, UID-, and endpoint-bound acknowledgement."
  reopened:
    - id: "M00-03.W4"
      implementation_commit: "3afa0e4cd971830246464dc73708c2eb95d6df32"
      result: "The prior process-group implementation used direct-child completion as a terminal condition. The repair now requires group quiescence, bounded TERM-to-KILL cleanup, bounded output drain, and explicit cancellation propagation; its exact-dev Linux evidence is still required."
      reopened_by:
        run: "33958038598"
        attempt: 1
        observation: "Run 69 exposed the need to distinguish direct child completion from complete process-group termination."
  in_progress:
    - id: "M00-03.W5"
      implementation_commit: "6be5a7a"
      result: "MIX runtime, MIX federation, and two-domain S2S fixtures now use child-owned ephemeral listeners, nonce/PID-bound readiness, and a child-owned relay for bootstrap DNS. The required Linux pressure matrix has not yet produced exact-SHA evidence."
      required_validation:
        - "50 parallel dual-node fixtures for 20 ordinary-CI rounds without EADDRINUSE."
        - "100 scheduled-stress rounds without EADDRINUSE."
        - "Occupied-port, invalid readiness nonce/PID/address, and three child-crash phase probes."
        - "Listener tests with --test-threads=16 without sleep-based synchronization."
