[package]
name = "northstar-room-application"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
test-support = []

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
northstar-abuse-policy = { path = "../../abuse/northstar-abuse-policy" }
northstar-archive-core = { path = "../../archive/northstar-archive-core" }
northstar-delivery-core = { path = "../../message/northstar-delivery-core" }
northstar-federation-core = { path = "../../federation/northstar-federation-core" }
northstar-room-core = { path = "../northstar-room-core" }
northstar-roster-core = { path = "../../roster/northstar-roster-core" }
northstar-runtime = { path = "../../../platform/northstar-runtime" }
northstar-xml-builder = { path = "../../../kernel/northstar-xml-builder" }
northstar-xep-0359 = { path = "../../../kernel/northstar-xep-0359" }
northstar-xmpp-avatar = { path = "../../../kernel/northstar-xmpp-avatar" }
northstar-xmpp-types = { path = "../../../kernel/northstar-xmpp-types" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time"] }
tracing = "0.1"
northstar-xep-0016 = { path = "../../../kernel/northstar-xep-0016" }
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
northstar-runtime = { path = "../../../platform/northstar-runtime", features = ["test-support"] }
roxmltree = "0.20"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
