[package]
name = "northstar-abuse-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "PostgreSQL persistence of Northstar anti-abuse state and the abuse key deployment authority."
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
northstar-abuse-application = { path = "../northstar-abuse-application" }
northstar-abuse-policy = { path = "../northstar-abuse-policy" }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
